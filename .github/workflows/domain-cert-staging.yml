name: Domain cert (staging)

# Custom-domain HTTPS for the staging droplet, out-of-band (scripts/domain-cert.sh):
# issues/renews the Let's Encrypt cert via ACME DNS-01 through Cloudflare, upserts
# the `staging.zimmer.tadasant.com -> tailnet IP` A record, and pushes ONLY the cert
# onto the box. The Cloudflare token stays in CI — never on the droplet.
#
# Runs on a weekly schedule (renew-if-needed; the script no-ops when the cert is
# still valid for >30 days), on demand, and via workflow_call so deploy-staging can
# chain it after a fresh droplet comes up.
#
# THE SCHEDULED RUN IS GUARDED, because staging is not always there. `teardown-staging`
# destroys the droplet on the nights nobody deployed to it, and with no droplet there is
# no tailnet IP to point the A record at and no box to push a cert to -- so an unguarded
# weekly cron would fail, and page #alerts through `alert-ci-failure.yml`, on a schedule
# of its own. The guard job below skips the week instead. Nothing is lost by skipping:
# `deploy-staging` chains this workflow after a fresh droplet comes up, so the cert is
# re-issued the moment there is somewhere to put it.
#
# Prod has its own copy of this in a private companion repo, pointed at the prod
# host + zone; the shared logic is scripts/domain-cert.sh so the two cannot drift.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      force_issue:
        description: "Issue a fresh cert even if the current one is still valid"
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_issue:
        type: boolean
        default: false

concurrency:
  group: domain-cert-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only the SCHEDULE is guarded: a human asking for a cert gets the attempt (and its
  # error) they asked for, and the deploy chain must not pay for a `terraform init` it does
  # not need -- it just applied, so the droplet is provably there.
  #
  # Note what `github.event_name` means in a REUSABLE workflow: it is the event that
  # triggered the CALLING run, not `workflow_call`. So the deploy chain skips this job
  # because `deploy-staging` is dispatch-only, not because it is a workflow_call. If
  # deploy-staging ever gains a `schedule:` trigger, this guard would start running inside
  # it -- harmless (it would find the droplet and proceed) but no longer free.
  guard:
    if: github.event_name == 'schedule'
    runs-on: self-hosted
    environment: staging
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          # The guard READS terraform's stdout to find the droplet, so it takes the raw
          # binary rather than the action's Node wrapper -- there is nothing here for the
          # wrapper's captured step outputs to be useful for, and one less layer between
          # `terraform state list` and the decision.
          terraform_wrapper: false

      - name: Is there a staging droplet to certify?
        id: decide
        env:
          # Read-only: the guard opens the remote state to look for the droplet, and talks
          # to neither DigitalOcean nor Cloudflare. `terraform state list` takes no state
          # lock either, which is why this job stays in the `domain-cert-staging`
          # concurrency group rather than joining `staging-lifecycle` -- it cannot conflict
          # with a `terraform apply` running alongside it, and putting it in that group
          # would make a weekly cert renewal able to queue behind a deploy.
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # See teardown-staging.yml: a boolean about the secret, never the secret.
          STAGING_IS_CONFIGURED: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        run: bash scripts/staging-lifecycle-guard.sh cert

  cert:
    needs: [guard]
    # `!cancelled()` and not `always()`: a plain `needs:` job is skipped when its
    # dependency is skipped, which is what happens on every dispatch and every
    # workflow_call -- so this has to run past a skipped `guard` while still respecting
    # a real cancellation.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.guard.outputs.proceed == 'true') }}
    runs-on: self-hosted
    environment: staging
    env:
      DOMAIN: staging.zimmer.tadasant.com
      TS_HOST: zimmer-staging
      CF_ZONE_ID: "7724dafbdb549223d8f0a9a51f5709da" # tadasant.com
      ACME_EMAIL: tadas@tadasant.com
      FORCE_ISSUE: ${{ inputs.force_issue && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the Cloudflare token
        # Pass the secret via env, never interpolated into the script body: inlining
        # `${{ secrets.* }}` into a run: block is a template-injection sink (and would
        # break on a token containing shell metacharacters).
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Mint a token scoped to"
            echo "::error::Zone:DNS:Edit + Zone:Zone:Read on tadasant.com and add it as"
            echo "::error::the CLOUDFLARE_API_TOKEN Actions secret. See docs/DOMAIN.md."
            exit 1
          fi

      # Join the tailnet as tag:zimmer-ci so we can `tailscale ssh` the droplet and
      # reach https://staging.zimmer.tadasant.com (which resolves to its tailnet IP).
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}

      - name: Issue/renew + push cert
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          set -euo pipefail
          # Push the cert over the Kamal deploy key rather than tailscale ssh, which a
          # self-hosted runner's tailnet identity may not satisfy.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_SSH_KEY" > ~/.ssh/cert_deploy_key
          chmod 600 ~/.ssh/cert_deploy_key
          export CERT_SSH_KEY="$HOME/.ssh/cert_deploy_key"
          bash scripts/domain-cert.sh

name: iOS UI tests

# Run the whole UI suite on a simulator and photograph every key screen: on every merge to
# `main` that touches `ios/**`, and on demand against whichever server it is told to.
#
# THE FULL RUN. `ci.yml`'s `ios` job gates every pull request on `ios/bin/ui-test --smoke`:
# a few tests, plus the classes the pull request's own changed UI test files declare, and no
# photographs. Every other UI test and every screenshot runs here, after the merge, because
# the whole of it — some 110 tests driven one at a time and some 90 photographs — is well
# over an hour, which is too long to gate every iOS pull request on.
# A failure on `main` reaches `#alerts` through `alert-ci-failure.yml`, like any other.
#
# FOUR SIMULATORS, A QUARTER OF THE SUITE EACH. On one runner the whole suite outgrew its
# 100-minute job: the last green single run took 89 minutes on 2026-10-18, and the four
# pushes after it (3ae3ff68, 65392f23, 05be5e66, 78b5acf9) were each cut off at the budget —
# which reads as "cancelled", which `alert-ci-failure.yml` does not report, so `main` had no
# post-merge UI coverage for four days and nothing said so. Each shard is a job of its own:
# `ios/bin/ui-test --only <classes>` runs its classes, and the `photos` shard also runs the
# `simctl` photograph pass a pull request body embeds. Each shard builds the app itself
# (about ten minutes) rather than sharing a gigabyte of DerivedData through an artifact —
# free on a public repository, and simpler than a fourth job and three downloads.
#
# THE ENTRY POINT AN AGENT CAN START. A branch's full run and screenshots, before it merges:
#
#   gh workflow run ios-ui-tests.yml --ref <branch>
#
# and a build pointed at a *different* server, watched as it runs:
#
#   gh workflow run ios-ui-tests.yml --ref main \
#     -f configuration=Staging -f api_base_url_variable=ZIMMER_IOS_STAGING_API_BASE_URL
#
# WHAT IT PROVES, AND WHAT IT CANNOT. It drives the app's Debug-only fixture
# (`-ZimmerFixture`, an in-memory Zimmer) and photographs the key screens. It signs into
# nothing: an agent cannot complete a Google sign-in, so no automated run reaches a real
# server. Pointing a build at staging therefore proves the build *resolves* the staging
# server, not that it can talk to it.
#
# THE GUARD, and why it is not the one `ci.yml` uses. This repository is public and the
# guard on every job there —
# `github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository`
# — is about fork PULL REQUESTS reaching a runner. There are none here: a push to `main` and
# `workflow_dispatch` are the only triggers, and only somebody with write access to this
# repository can do either. That expression is also false on every dispatch, so it would
# stop the on-demand run from ever starting. What this needs instead is the other half of
# the same idea, and it is the job's `if:` below: refuse any
# repository but this one, so a fork that copies this file runs nothing. NEVER add
# `pull_request` or `pull_request_target` here — a fork PR would then execute fork code,
# and the `ci.yml` fork guard would have to come with it.
#
# NO CREDENTIAL. A simulator build needs no identity, no certificate, no provisioning
# profile and no App Store Connect key, so unlike `testflight.yml` this holds nothing and
# needs no environment. It also names no host: the server is read from a repository or
# environment VARIABLE whose name is given as an input, so this public file never contains
# one.
#
# THE COST. It runs on GitHub-hosted macOS runners, which GitHub bills at roughly ten
# times the Linux multiplier — free on a public repository, which this is, and not free on
# a private one. A run is four jobs of 25 to 45 minutes each, in parallel: an Xcode build
# apiece, then a quarter of the UI tests, and on one of them the photographs.

on:
  # A push carries no inputs: it runs Staging against the reserved-by-RFC-2606
  # `https://ui-test.invalid`, as `ci.yml`'s smoke run does, and uploads everything.
  # `ios/App/ZimmerUITests/**` is deliberately NOT excluded, unlike in `testflight.yml`:
  # a merged UI test is exactly what this runs.
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/README.md"
      - "!ios/Tests/**"
      - ".github/workflows/ios-ui-tests.yml"
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration. Staging carries ZIMMER_BUILD_ENVIRONMENT=staging; Debug carries development."
        type: choice
        options: [Staging, Debug]
        default: Staging
      api_base_url_variable:
        description: >-
          The NAME of a repository or environment variable holding the https base URL to
          build against. A name rather than a URL, so no deployment's host is ever typed
          into a public repository's Actions UI or its logs. Leave empty to build with no
          default server.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One run at a time per trigger. A dispatch cancels an older dispatch, which nobody is
# waiting on mid-run. A push run is never cancelled: it is the post-merge gate for every UI
# test the pull request's smoke run skipped, and `alert-ci-failure.yml` is silent on a
# cancelled run, so a merge landing inside the previous run's hour would otherwise
# hide a red suite on `main` for good. Pushes queue instead; GitHub keeps only the newest
# pending one, so the queue is never more than one deep.
concurrency:
  group: ios-ui-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ui-test:
    name: ui-test (${{ matrix.shard.name }})
    if: ${{ github.repository == 'tadasant/zimmer' }}
    runs-on: macos-latest
    # THE BALANCE is by the per-class seconds of green runs (the last green single run,
    # actions/runs/39113483415, and the full-suite dispatches on the parity branches that
    # added the newer classes: 38970424260, 38908829804, 38974169702, 38991532403):
    #   operations    Operations 800, TriggerEditor 270, OperationsActions 175,
    #                 Inference ~300 (no green run yet; six tests)              ≈ 1545 s
    #   session-page  SessionDetailPanels 415, Settings 320, BoardReadParity 270,
    #                 SessionControls 270, TranscriptParity 260                   ≈ 1535 s
    #   board         SessionParity+BoardView+Ranked (one file) 266, SessionActions 125,
    #                 SessionExtras 100, Live 92, Attachments 90, SessionSections 87,
    #                 Catalog 75, QuickRouterKeyboard 72, LiveUpdates 67            ≈  975 s
    #   photos        Account 625, Waiting 62, Interaction 59, Decisions 58,
    #                 SessionList 47, BoardFilters 35, InAppLinks ~30,
    #                 BoardStaysCurrent 23                                        ≈  940 s
    #                 + the photograph pass, some 90 screenshots at a six-second settle
    # A new class goes in whichever shard is lightest; test/config/ios_ui_test_shards_test.rb
    # fails the Linux `test-unit` job on a class that is in no shard or in two, so a class
    # the matrix forgets never silently stops running.
    strategy:
      # One shard's red must not cancel the other three: their artifacts are the evidence for
      # the tests THEY ran, and nobody here has a Mac to reproduce a cancelled one on.
      fail-fast: false
      matrix:
        shard:
          - name: operations
            classes: OperationsUITests,TriggerEditorUITests,OperationsActionsUITests,InferenceUITests
            photos: false
          - name: session-page
            classes: SessionDetailPanelsUITests,SettingsUITests,BoardReadParityUITests,SessionControlsUITests,TranscriptParityUITests
            photos: false
          - name: board
            classes: SessionParityUITests,BoardViewUITests,RankedUITests,SessionActionsUITests,SessionExtrasUITests,LiveUITests,AttachmentsUITests,SessionSectionsUITests,CatalogUITests,QuickRouterKeyboardUITests,LiveUpdatesUITests
            photos: false
          - name: photos
            classes: AccountUITests,WaitingUITests,InteractionUITests,DecisionsUITests,SessionListUITests,BoardFiltersUITests,InAppLinksUITests,BoardStaysCurrentUITests
            photos: true
    # Per shard: ten minutes of Xcode build, a simulator boot, 16 to 26 minutes of UI tests
    # at the balance above (double that on a loaded runner: 52 at most), ten minutes of
    # photographs on the one shard that takes them, and the upload — under the budget even
    # loaded. A run cut off here reads as "cancelled", which hides whether the suite passed,
    # so rebalance the shards, or add a fifth, before raising it.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve the server from the named variable
        id: server
        env:
          # The whole variables context, as JSON. Looked up by name below rather than
          # interpolated directly, because the input names a variable and a GitHub
          # expression has no `vars[input]` indirection.
          ALL_VARS: ${{ toJSON(vars) }}
          WANTED: ${{ inputs.api_base_url_variable }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ]; then
            echo "url=https://ui-test.invalid" >> "$GITHUB_OUTPUT"
            echo "A push: building against the reserved ui-test.invalid, as ci.yml's smoke run does."
            exit 0
          fi
          if [ -z "${WANTED}" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "Building with no default server."
            exit 0
          fi
          url="$(printf '%s' "$ALL_VARS" | jq -r --arg key "$WANTED" '.[$key] // ""')"
          if [ -z "$url" ]; then
            echo "::error::No repository or environment variable named ${WANTED}. Set one, or leave the input empty."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::${WANTED} must hold an https:// URL."; exit 1 ;;
          esac
          # Masked in BOTH spellings, and that is the whole of it rather than belt and
          # braces: `::add-mask::` is exact-substring replacement, and `ios/bin/ui-test`
          # derives the bare host from the URL to compare against what the app reports. A
          # failed assertion prints that bare host, which the full-URL mask would not have
          # touched. This repository is public and a workflow log is public with it.
          host="${url#https://}"; host="${host%%[:/]*}"
          echo "::add-mask::$url"
          echo "::add-mask::$host"
          # Heredoc rather than `k=v`: a newline in the variable's value would otherwise
          # let it inject step outputs of its own.
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            printf 'url<<%s\n' "$delimiter"
            printf '%s\n' "$url"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${WANTED}."

      - name: Run this shard of the UI tests on a simulator, and photograph it on the photos shard
        # The same script `ci.yml`'s `ios` job runs, without `--smoke` and with `--only`
        # naming this shard's classes. A check that exists only in a workflow cannot be run
        # by hand and will rot, so the workflow's whole body is a call to a script anybody
        # with a Mac runs unchanged.
        #
        # Every input arrives through `env:` rather than through `${{ }}` inside the
        # command, so nothing a dispatcher typed is ever pasted into a shell line; the shard
        # goes through a bash array because a `false && '' || '--no-photos'` ternary is the
        # expression idiom that quietly evaluates to `--no-photos` on BOTH branches.
        env:
          ZIMMER_UI_TEST_CONFIGURATION: ${{ inputs.configuration || 'Staging' }}
          ZIMMER_IOS_API_BASE_URL: ${{ steps.server.outputs.url }}
          SHARD_CLASSES: ${{ matrix.shard.classes }}
          SHARD_PHOTOS: ${{ matrix.shard.photos }}
        run: |
          set -euo pipefail
          args=(--only "$SHARD_CLASSES")
          [ "$SHARD_PHOTOS" = "true" ] || args+=(--no-photos)
          ios/bin/ui-test \
            --configuration "$ZIMMER_UI_TEST_CONFIGURATION" \
            --artifacts "$RUNNER_TEMP/ui-test" \
            "${args[@]}"

      # ONLY when no real server was named, and that is a disclosure rule rather than a
      # size one. A workflow artifact on a public repository is downloadable by any GitHub
      # user, and `::add-mask::` does nothing to file contents — while the run's video and
      # screenshot show the app's own build-target line, and the result bundle carries the
      # built `Info.plist`. So a run pointed at a real deployment keeps its evidence in the
      # log (masked) and uploads nothing; a push run, like `ci.yml`'s, builds against a
      # reserved-by-RFC-2606 name that can never resolve and uploads everything.
      # One artifact per shard, named for it — four jobs uploading the same name would fail
      # the second onwards — and `shard.txt` inside says which classes it covers. The
      # screenshots a pull request body embeds are in `ios-ui-test-<configuration>-photos`.
      - name: Keep what the run produced
        if: ${{ always() && inputs.api_base_url_variable == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-${{ inputs.configuration || 'Staging' }}-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/ui-test
          retention-days: 14
          if-no-files-found: warn

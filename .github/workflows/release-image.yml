name: Release image

# On every push to main, build the app image and push it to GHCR with an
# auto-incremented PATCH version, plus :latest and the commit SHA.
#
# Versioning (deterministic, no commit-back required):
#   - The committed VERSION file is the MANUAL floor, e.g. "0.1.0".
#   - Effective version = MAJOR.MINOR.(BASE_PATCH + commits_since_VERSION_changed).
#   - To cut a MINOR or MAJOR bump: edit VERSION in a PR (e.g. 0.1.0 -> 0.2.0).
#     That commit touches VERSION, so the offset resets and the next image is
#     exactly the version you wrote; subsequent commits auto-bump the patch.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to count commits since VERSION changed

      # The self-hosted host runs many runner workers as one OS user, so the
      # default ~/.docker is shared mutable state across concurrently-running
      # jobs (see the "Set up Buildx" comment below). Give this job its own.
      # Exported via $GITHUB_ENV rather than job-level `env:` because the
      # `runner` context is not available there and would expand to "".
      - name: Isolate Docker client state for this job
        run: |
          cfg="${RUNNER_TEMP}/docker-config"
          rm -rf "$cfg"
          mkdir -p "$cfg"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE" | cut -d. -f3)
          # SHA of the last commit that modified VERSION (the manual floor).
          VERSION_SHA=$(git log -1 --format=%H -- VERSION)
          # Commits on main since that floor was set (0 on the floor commit itself).
          OFFSET=$(git rev-list --count "${VERSION_SHA}..HEAD")
          PATCH=$((BASE_PATCH + OFFSET))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          # The tag list is emitted here rather than inline in the build step so
          # the first attempt and the retry below cannot drift apart.
          {
            echo "version=${VERSION}"
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/tadasant/zimmer:${VERSION}"
            echo "ghcr.io/tadasant/zimmer:latest"
            echo "ghcr.io/tadasant/zimmer:sha-${GITHUB_SHA}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image version: ${VERSION} (floor ${BASE}, +${OFFSET} commits)"

      # `.github/scripts/ghcr-login.sh` runs the same `docker login --password-stdin` a
      # `docker/login-action` step runs, with the same escalating 90s/240s backoff the
      # build attempts below use. A single-shot login is a single point of failure in
      # front of everything else in this job: on 2026-09-02 one
      # `net/http: TLS handshake timeout` reaching ghcr.io/token failed the release 48
      # seconds in and skipped every step after it, against the same registry the push
      # half already retries three times.
      - name: Log in to GHCR
        env:
          REGISTRY: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_BACKOFF_SECONDS: "90 240"
        run: .github/scripts/ghcr-login.sh

      # `docker buildx create --use` records the chosen builder in a single
      # current-builder file under $DOCKER_CONFIG, and build-push-action reads
      # that file to decide which builder to build on. With the shared default
      # config dir, a concurrent job's `--use` steals it: this job then builds
      # on the other job's buildkit container, and when that job ends its post
      # step's `docker buildx rm` kills the container mid-build ("graceful_stop"
      # GOAWAY, then `no builder "<other-uuid>" found`). The per-job
      # DOCKER_CONFIG above stops the theft; `builder:` below makes each build
      # name its own builder explicitly so it can never be inferred wrong.
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # Resolve the base from the CONTENT it declares, not from whether the one
      # push currently being handled changed Dockerfile.base. The old diff-only
      # check had a hole: a base build could fail, then the next push saw no new
      # Dockerfile.base diff and built the app from stale :latest. A content tag
      # is absent until this exact declaration built successfully, so no later
      # commit can skip over a failed base build.
      - name: Resolve base image
        id: base
        run: |
          set -euo pipefail
          # ls-tree covers each input's path, executable mode, and blob content.
          # The preinstall script's mode affects whether Dockerfile.base can run it.
          BASE_KEY=$(git ls-tree HEAD -- Dockerfile.base Gemfile Gemfile.lock mcp.json bin/preinstall-mcp-packages |
            sha256sum | cut -c1-20)
          BASE_IMAGE="ghcr.io/tadasant/zimmer-base:content-${BASE_KEY}"
          echo "image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"

          # This read fails CLOSED into need_base=true, so a hiccup here does not fail the
          # job — it escalates into a full base rebuild and push against a registry that
          # may already be refusing the account. Retry it a couple of times first.
          #
          # Blind, like every other registry retry in this job, and for a sharper reason:
          # the one error that would look like "genuinely absent" is a 404, and a 404 on a
          # manifest is a shape the GHCR throttle has already worn (see await-ghcr.sh).
          # Reading the error is exactly the mistake that has bitten this workflow.
          #
          # The backoffs are seconds rather than the 90s/240s the build attempts use
          # because this step is not fatal and the wait is paid on the ordinary path too:
          # a base declaration that genuinely changed is absent, so it exhausts the retries
          # every time. 20 seconds is a rounding error against the base build that follows;
          # 5.5 minutes on every base bump would not be.
          present=false
          for backoff in 5 15 stop; do
            if docker buildx imagetools inspect "$BASE_IMAGE" >/dev/null 2>&1; then
              present=true
              break
            fi
            [ "$backoff" = stop ] && break
            echo "Manifest read for ${BASE_IMAGE} failed; retrying in ${backoff}s in case GHCR is hiccuping."
            sleep "$backoff"
          done

          if [ "$present" = true ]; then
            echo "need_base=false" >> "$GITHUB_OUTPUT"
            echo "Exact base image ${BASE_IMAGE} exists; reusing it."
          else
            echo "need_base=true" >> "$GITHUB_OUTPUT"
            echo "Exact base image ${BASE_IMAGE} is missing; building it before the app image."
            echo "::notice::Every manifest read for ${BASE_IMAGE} came back empty, so this is being treated as a genuinely new base declaration — which is the ordinary outcome of changing one of the base inputs. If the base build below then fails on registry errors, suspect a throttle rather than the Dockerfile."
          fi

      - name: Build & push base image
        if: steps.base.outputs.need_base == 'true'
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ steps.base.outputs.image }}
            ghcr.io/tadasant/zimmer-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # This step talks to GHCR at both ends, and a secondary rate limit against the
      # account breaks either one. Buildkit PULLS the zimmer-base layers on the way in
      # — seen as a 403 on a blob, and (same throttling, different mask) as a 404 on a
      # base manifest buildkit resolved seconds earlier. It PUSHES the finished image
      # on the way out — seen as a 403 on a HEAD to a zimmer blob. None of the three
      # means anything is wrong with the images or the credentials, and all three fail
      # the release outright, so a registry hiccup pages a human over a build that
      # would pass on the next try.
      #
      # So: up to three attempts, backing off 90s then 240s, and only the last one is
      # allowed to fail the job. Escalating rather than fixed because the throttle is
      # account-wide and has outlasted a single 90s wait — on 2026-08-06 it took out
      # this workflow and the prod deploy in a different repo inside the same two
      # minutes. The `continue-on-error` on the earlier attempts is load-bearing twice
      # over: it swallows their failure, and it keeps the job green so the implicit
      # success() on the later attempts' `if` lets them run at all.
      #
      # The retry is deliberately blind — it does not read the error, because the same
      # throttle has already worn three different HTTP shapes and coupling the release
      # to registry error strings trades a rare wasted rebuild for a missed one. What
      # the wait steps do instead is PROBE GHCR and say, in an annotation, whether the
      # registry was answering: a probe that fails points at the registry, a probe that
      # succeeds points at the build itself. That is the signal to read on a run that
      # exhausted its attempts, since an exercised retry renders the earlier attempts
      # with a red ✗ against a green job (GitHub has no separate rendering for a step
      # that failed under continue-on-error).
      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          pull: true
          # Pin the app build to the exact successfully-built base declaration.
          # Never fall back to mutable :latest after a failed base build.
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `continue-on-error` for the same reason the attempts carry it, and it matters
      # more here: a backoff step that exits non-zero — a dropped env key, an exec bit
      # lost in checkout — would flip the job to failed, and the implicit success() on
      # every later `if` would then skip the remaining attempts AND the prod notify.
      # The whole retry chain would sit there intact and unreachable. A probe that
      # cannot run should cost the backoff, not the release.
      - name: Wait out the registry throttle
        continue-on-error: true
        if: steps.build.outcome == 'failure'
        env:
          BACKOFF_SECONDS: "90"
          ATTEMPT: "1"
        run: .github/scripts/await-ghcr.sh

      - name: Build and push (retry)
        id: retry
        continue-on-error: true
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait out the registry throttle (second backoff)
        continue-on-error: true
        if: steps.build.outcome == 'failure' && steps.retry.outcome == 'failure'
        env:
          BACKOFF_SECONDS: "240"
          ATTEMPT: "2"
        run: .github/scripts/await-ghcr.sh

      - name: Build and push (final attempt)
        if: steps.build.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify the production repo (instant cross-deploy)
        # Fire a repository_dispatch so a private production repo's auto-upgrade +
        # IaC-sync workflows run the instant a new image publishes, instead of waiting
        # for their polls. This NEVER fails the release: it is a no-op unless BOTH the
        # PROD_DISPATCH_REPO variable (the `owner/repo` to notify) and the
        # GH_PROD_DISPATCH_TOKEN secret (a PAT with Contents:write on that repo -- the
        # repository_dispatch API is gated by Contents write; there is no separate
        # "dispatch" scope) are set. A non-2xx response only warns -- prod still catches
        # up on its own schedule.
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_PROD_DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ vars.PROD_DISPATCH_REPO }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ] || [ -z "${DISPATCH_REPO:-}" ]; then
            echo "PROD_DISPATCH_REPO var or GH_PROD_DISPATCH_TOKEN secret not set; skipping instant-cross dispatch."
            echo "(The production repo still catches up via its scheduled polls.)"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
            -d "{\"event_type\":\"zimmer-image-published\",\"client_payload\":{\"version\":\"${VERSION}\",\"sha\":\"${GITHUB_SHA}\"}}") || true
          if [ "$code" = "204" ]; then
            echo "Dispatched zimmer-image-published to the production repo (version ${VERSION})."
          else
            echo "::warning::repository_dispatch returned HTTP ${code}; prod will catch up on its schedule."
            cat /tmp/dispatch.out 2>/dev/null || true
          fi

      # Stands in for the post step `docker/login-action` contributes, which a retrying
      # `docker login` does not get. Belt and braces: the credential is job-scoped
      # already, landing in the per-job $DOCKER_CONFIG above and holding a GITHUB_TOKEN
      # that expires with the job. `always()` because the run that leaves credentials
      # behind is the one that failed, and `|| true` because a logout that cannot run
      # must not be what fails the release.
      #
      # The `env.DOCKER_CONFIG` guard is the load-bearing part. `always()` also fires on
      # the runs where checkout or the isolation step itself failed, and DOCKER_CONFIG is
      # empty on exactly those — a `docker logout` then writes to the shared ~/.docker
      # this job goes to such lengths to stay out of, stripping GHCR credentials out from
      # under a concurrent job's push. login-action's post step could not reach that
      # state, because a post step runs only if its own step did.
      - name: Log out of GHCR
        if: always() && env.DOCKER_CONFIG != ''
        run: docker logout ghcr.io || true

name: Deploy staging

# Manually-invoked ONLY. Builds the app image from the chosen ref, Terraform-applies
# the PERSISTENT staging droplet (Tailscale-only), and deploys the app onto it with
# Kamal (health-gated zero-downtime swap + one-command rollback). Never auto-deploys.
#
# This replaces the old reap-and-recreate flow: Terraform now reconciles a long-lived
# droplet through remote state (no raw DO API reap of account-unique names), and app
# changes ride Kamal instead of re-rendering cloud-init and force-replacing the box.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build & deploy"
        required: false
        default: ""
      recreate_droplet:
        description: >-
          Force-rebuild the droplet (terraform -replace). Needed ONLY when the
          bootstrap itself must change -- rotating the Kamal deploy key, changing the
          domain/Caddyfile -- because `ignore_changes = [user_data]` deliberately
          hides those from the plan. Normal app deploys must leave this off.
        type: boolean
        required: false
        default: false
      nested_docker:
        description: >-
          Run the worker under sysbox with its own Docker daemon, so agent sessions
          can use .agent-containers/. ON by default for staging. Turn it OFF to deploy
          the worker under plain runc as uid 1000 -- the rollback if a sysbox deploy
          misbehaves, and what to pick if the droplet was rebuilt without sysbox.
        type: boolean
        required: false
        default: true

concurrency:
  group: staging-lifecycle
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The self-hosted host runs many runner workers as one OS user, so the
      # default ~/.docker is shared mutable state across concurrently-running
      # jobs (see the "Set up Buildx" comment below). Give this job its own.
      # Exported via $GITHUB_ENV rather than job-level `env:` because the
      # `runner` context is not available there and would expand to "".
      - name: Isolate Docker client state for this job
        run: |
          cfg="${RUNNER_TEMP}/docker-config"
          rm -rf "$cfg"
          mkdir -p "$cfg"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Resolve image tag
        id: img
        run: echo "tag=staging-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker buildx create --use` records the chosen builder in a single
      # current-builder file under $DOCKER_CONFIG, and build-push-action reads
      # that file to decide which builder to build on. With the shared default
      # config dir, a concurrent job's `--use` steals it: this job then builds
      # on the other job's buildkit container, and when that job ends its post
      # step's `docker buildx rm` kills the container mid-build ("graceful_stop"
      # GOAWAY, then `no builder "<other-uuid>" found`). The per-job
      # DOCKER_CONFIG above stops the theft; `builder:` below makes each build
      # name its own builder explicitly so it can never be inferred wrong.
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push base image
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/tadasant/zimmer-base:staging
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          build-args: |
            BASE_IMAGE=ghcr.io/tadasant/zimmer-base:staging
          push: true
          tags: |
            ghcr.io/tadasant/zimmer:${{ steps.img.outputs.tag }}
            ghcr.io/tadasant/zimmer:staging-latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # Only when rebuilding the droplet: free the `zimmer-staging` MagicDNS name, so
      # the replacement reclaims it instead of registering as zimmer-staging-1. On a
      # normal deploy the droplet persists and its node must NOT be reaped.
      - name: Reap stale tailnet node (only when recreating)
        if: ${{ inputs.recreate_droplet }}
        env:
          TS_API_CLIENT_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TS_API_CLIENT_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
        run: bash scripts/tailnet-reap-node.sh zimmer-staging

      # Provision (or reconcile) the persistent staging droplet + reserved IP through
      # remote state. Idempotent: a re-run updates in place, it does NOT recreate --
      # unless recreate_droplet forces -replace (see the input's description).
      - name: Terraform apply (staging)
        working-directory: infra/terraform
        env:
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_deploy_ssh_pubkey: ${{ secrets.KAMAL_SSH_PUBKEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # Operator/tooling public keys cloud-init authorizes for root, as a JSON list of
          # strings: ["ssh-ed25519 AAAA... op@host"]. An Actions VARIABLE (repo or the
          # `staging` environment) -- public keys are not secrets, and GitHub would mask a
          # secret's value out of the accounting printed below. Deliberately NOT the
          # committed staging.tfvars.example: this repo is public and the step copies that
          # file verbatim, so a key sitting in it is a key authorized for root on every
          # FORK's droplet. Unset is the safe fall-through -- var.admin_ssh_pubkeys
          # defaults to [] and the box authorizes nothing beyond the Kamal deploy key.
          ADMIN_SSH_PUBKEYS: ${{ vars.ADMIN_SSH_PUBKEYS }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=backend.staging.hcl
          cp staging.tfvars.example staging.tfvars
          # Report who this apply would authorize for root, on EVERY deploy. The list is
          # now an Actions variable: invisible state that nothing else in the run would
          # surface, and that takes effect only at droplet CREATION (cloud-init) -- so an
          # unset variable is otherwise discovered as "the rebuilt box locked me out".
          # staging.tfvars.example deliberately assigns nothing, because a -var-file value
          # BEATS TF_VAR_* in Terraform's precedence order: an assignment there would not
          # add to this list, it would silently replace it.
          keys=0
          if [ -n "${ADMIN_SSH_PUBKEYS:-}" ]; then
            if ! jq -e 'type == "array" and all(type == "string")' >/dev/null 2>&1 <<<"$ADMIN_SSH_PUBKEYS"; then
              echo "::error::ADMIN_SSH_PUBKEYS is set but is not a JSON list of strings."
              echo "::error::Terraform reads it as list(string), so write it as:"
              echo "::error::  [\"ssh-ed25519 AAAA... op@host\", \"ssh-ed25519 AAAA... you@laptop\"]"
              exit 1
            fi
            keys=$(jq -r length <<<"$ADMIN_SSH_PUBKEYS")
          fi
          # An explicit `[]` is the same outcome as unset -- a box nobody is authorized on --
          # so it takes the same warning path rather than a green tick over an empty list.
          if [ "$keys" -gt 0 ]; then
            export TF_VAR_admin_ssh_pubkeys="$ADMIN_SSH_PUBKEYS"
            # Comment field = everything after the type and the body. Split on runs of
            # whitespace and drop empties: a double space, a leading space, or a multi-word
            # comment must not silently print the key body (or the type) as the identity.
            echo "✅ admin_ssh_pubkeys: $keys key(s) authorized for root on :2222 --" \
                 "$(jq -r '[.[] | split(" ") | map(select(. != "")) | if length > 2 then .[2:] | join(" ") else "(no comment)" end] | join(", ")' <<<"$ADMIN_SSH_PUBKEYS")"
          else
            # Never inherit one from the runner's ambient environment: the log below asserts
            # that nothing is authorized, and a leaked value would make that assertion a lie.
            unset TF_VAR_admin_ssh_pubkeys
            echo "::warning::ADMIN_SSH_PUBKEYS is unset or empty, so admin_ssh_pubkeys=[] and this apply authorizes NO"
            echo "::warning::operator key for root. The deploy itself is unaffected (Kamal has its own key) and"
            echo "::warning::humans still reach the box over Tailscale SSH on :22 -- what is gone is the publickey"
            echo "::warning::door on :2222, so every ssh-* MCP server in a session fails its startup health check."
            if [ "${{ inputs.recreate_droplet }}" = "true" ]; then
              echo "::warning::recreate_droplet=true, which is the moment this bites: cloud-init runs at creation"
              echo "::warning::ONLY, so the replacement droplet comes up with an empty /root/.ssh/admin_keys.pub."
            fi
          fi
          replace=""
          if [ "${{ inputs.recreate_droplet }}" = "true" ]; then
            echo "::warning::recreate_droplet=true — replacing the droplet (bootstrap change)."
            replace="-replace=digitalocean_droplet.zimmer"
          fi
          terraform apply -input=false -auto-approve -var-file=staging.tfvars $replace

      # Join the tailnet so we can resolve the droplet's tailnet IP, SSH to it with
      # Kamal, and health-check the app.
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}

      # GitHub runners get no MagicDNS, so resolve zimmer-staging's tailnet IP from
      # `tailscale status`, and load the Kamal deploy key.
      - name: Prepare Kamal SSH + resolve host
        id: host
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
          EOF
          for i in $(seq 1 40); do
            ip=$(tailscale status --json 2>/dev/null \
              | jq -r '.Peer[]? | select(.HostName=="zimmer-staging" and .Online==true) | .TailscaleIPs[0]' \
              | head -1)
            if [ -n "${ip:-}" ] && [ "$ip" != "null" ]; then
              echo "staging_host=$ip" >> "$GITHUB_OUTPUT"
              echo "resolved zimmer-staging -> $ip"
              exit 0
            fi
            echo "waiting for zimmer-staging on the tailnet ($i/40)…"
            sleep 15
          done
          echo "::error::zimmer-staging never came online on the tailnet"
          exit 1

      # DigitalOcean force-expires root's password on any droplet created without a
      # DO-registered SSH key (ssh_key_fingerprints is deliberately empty -- it is ForceNew),
      # and pam_unix then refuses EVERY real-OpenSSH session on :2222 after publickey auth has
      # already succeeded. cloud-init clears that at first boot, but it only runs at CREATION:
      # a droplet that predates it -- or one whose password was reset through the DO console,
      # which re-expires it -- stays broken. So converge on every deploy, over Tailscale SSH
      # (:22, the path the expiry does not block). Convergent and retried, so a healthy box
      # and a still-booting one both come out fine.
      - name: Clear forced root-password expiry (converge)
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
        run: bash scripts/clear-root-password-expiry.sh "$STAGING_HOST"

      # Ruby matching .ruby-version, with a user-writable gem dir. (The runner's stock
      # system Ruby installs into /var/lib/gems, which needs root -- `gem install`
      # there fails with Gem::FilePermissionError.)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: false
          self-hosted: true

      # Pin Kamal to the exact version the repo locks (Gemfile.lock) so CI can't drift
      # onto a different 2.x. Installed standalone rather than via `bundle install`,
      # which would build the app's native gems (pg, nokogiri) on the runner for no
      # reason -- the deploy only needs Kamal itself.
      - name: Install Kamal (pinned to Gemfile.lock)
        run: |
          set -euo pipefail
          v=$(awk '/^    kamal \(/{gsub(/[()]/,"");print $2; exit}' Gemfile.lock)
          echo "installing kamal ${v} (from Gemfile.lock)"
          gem install kamal -v "$v" --no-document
          kamal version

      # Staging deploys the worker under sysbox so agent sessions get their own Docker
      # daemon. That needs three things on the HOST, and each one missing fails in a
      # way that is miserable to diagnose from the app side:
      #
      #   no sysbox-runc runtime   -> Kamal's `docker run --runtime sysbox-runc` dies
      #                               with "unknown or invalid runtime name", mid-cutover.
      #   runtime but no user ns   -> the container's root IS host root. The entrypoint
      #                               refuses to start dockerd (by design) and the worker
      #                               crash-loops on a message nobody is tailing.
      #   no time-namespaces flag  -> NO sysbox container starts at all, not even
      #                               `docker run alpine echo hi`. See nestybox/sysbox#1011.
      #
      # One command settles all three: start a throwaway sysbox container and read its
      # uid_map. A non-identity first line (`0 100000 65536`) means the runtime resolved,
      # the flag is in place, and the user namespace is real. An identity map
      # (`0 0 4294967295`) means container root is host root -- refuse to deploy, because
      # that is the exact configuration this whole mechanism exists to avoid.
      - name: Preflight the droplet's sysbox runtime
        if: ${{ inputs.nested_docker }}
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
        run: |
          set -euo pipefail
          # Diagnostic only, and deliberately not fatal: if the daemon or the SSH hop is
          # broken, the sysbox check below fails anyway and says so in terms of the thing
          # we actually care about. Letting this line abort the step first would replace
          # that message with a raw docker/ssh error.
          echo "--- registered runtimes ---"
          ssh root@"${STAGING_HOST}" \
            "docker info --format '{{range \$k,\$v := .Runtimes}}{{\$k}} {{end}}'" || true

          if ! map=$(ssh root@"${STAGING_HOST}" \
                'docker run --rm --runtime=sysbox-runc alpine head -1 /proc/self/uid_map' 2>&1); then
            echo "::error::The droplet cannot start a sysbox container, so the worker would not start either."
            echo "::error::${map}"
            echo "--- /etc/docker/daemon.json ---"
            ssh root@"${STAGING_HOST}" 'cat /etc/docker/daemon.json' || true
            echo "--- sysbox units ---"
            ssh root@"${STAGING_HOST}" 'systemctl is-active sysbox sysbox-mgr sysbox-fs' || true
            echo "::error::Install sysbox (docs/operate/nested-docker.md, 'Turning it on'), or re-run"
            echo "::error::this workflow with nested_docker unchecked to deploy under plain runc."
            exit 1
          fi

          echo "sysbox container uid_map: ${map}"
          # Field 2 is the host uid that container uid 0 maps to. 0 means no namespace.
          host_uid=$(echo "${map}" | awk '{print $2}')
          if [ "${host_uid}" = "0" ]; then
            echo "::error::A sysbox container started but its root maps to host uid 0 -- there is no"
            echo "::error::user namespace, so the worker's root would be real host root. Refusing to deploy."
            exit 1
          fi
          echo "✅ sysbox works: container root maps to host uid ${host_uid}, not 0"

      # Deploy onto the persistent host. `accessory boot` is already idempotent in
      # Kamal 2 (it skips a container that exists), so this is NOT `|| true`-guarded:
      # a genuine failure here (registry login, image pull, bad DB password) must fail
      # the deploy loudly instead of surfacing later as an opaque health-check timeout.
      # The image was built above, so --skip-push just pulls the existing tag.
      - name: Kamal deploy (staging)
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
          # Explicit rather than left to config/deploy.staging.yml's default, so the
          # dispatch checkbox is a real lever and the deploy log records which way it
          # went. The config still defaults this ON -- see its header.
          ZIMMER_NESTED_DOCKER: ${{ inputs.nested_docker && '1' || '0' }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
          STAGING_SECRET_BASE: ${{ secrets.STAGING_SECRET_BASE }}
          STAGING_API_KEYS: ${{ secrets.STAGING_API_KEYS }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_RAILS_MASTER_KEY: ${{ secrets.STAGING_RAILS_MASTER_KEY }}
          # Base64 of the operator SSH private key (see .kamal/secrets.staging). Unset
          # is survivable: the app boots, but sessions get no SSH identity and every
          # ssh-* MCP server fails its startup health check.
          STAGING_OPERATOR_SSH_KEY: ${{ secrets.STAGING_OPERATOR_SSH_KEY }}
          # Base64 of the Parameter Store resolver's service-account key JSON (see
          # .kamal/secrets.staging). It MUST be named here as well as mapped there:
          # a var missing from this env: block just arrives empty, and Kamal's
          # FOO=$FOO mapping resolves to blank with no error -- so the deploy looks
          # completely healthy while the store never turns on. Unset is survivable by
          # design: the chain falls back to staging.yml.enc and nothing raises.
          STAGING_ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.STAGING_ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON }}
          # Observability. STAGING_-prefixed on purpose -- see .kamal/secrets.staging.
          # STAGING_SENTRY_DSN_BACKEND must be the DSN of a SEPARATE GlitchTip project
          # (zimmer-staging), never production's: GlitchTip's Slack alert has no
          # environment filter, so a shared DSN makes every staging error page #alerts.
          STAGING_SENTRY_DSN_BACKEND: ${{ secrets.STAGING_SENTRY_DSN_BACKEND }}
          STAGING_OTEL_LOGS_EXPORTER_ENDPOINT: ${{ secrets.STAGING_OTEL_LOGS_EXPORTER_ENDPOINT }}
          STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN: ${{ secrets.STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          # API_KEYS is a comma-separated list; the injected self-session MCP server
          # needs a SINGLE key to call this instance's own REST API.
          export STAGING_SELF_API_KEY="${STAGING_API_KEYS%%,*}"
          if [ -z "$STAGING_SELF_API_KEY" ]; then
            echo "::error::STAGING_API_KEYS is empty, so ZIMMER_STAGING_API_KEY would be blank."
            echo "::error::SecretsInterpolator treats blank-but-set exactly like unset, so every session"
            echo "::error::would fail with MissingVariableError -- the bug this wiring exists to prevent."
            exit 1
          fi
          # RAILS_MASTER_KEY is deliberately NOT fatal, unlike the key above. It decrypts
          # config/credentials/staging.yml.enc, and ActiveSupport reads it as
          # `ENV["RAILS_MASTER_KEY"].presence` -- so blank behaves exactly like unset: the
          # credentials stay inert and the app still boots healthy. Failing here would turn
          # a degraded deploy into a broken one for anyone (a fork, a self-hoster) who has
          # not set the secret.
          if [ -z "${STAGING_RAILS_MASTER_KEY:-}" ]; then
            echo "::warning::STAGING_RAILS_MASTER_KEY is unset, so config/credentials/staging.yml.enc stays encrypted."
            echo "::warning::Staging will boot, but SecretsLoader serves nothing: Slack triggers and AlertService"
            echo "::warning::go quiet, and every MCP server with a \${VAR} from mcp_secrets fails to start a session."
          fi
          # Observability preflight. Also non-fatal -- both initializers are hard
          # no-ops on an empty value, so staging boots fine without them. But an
          # unset obs secret is otherwise INVISIBLE: the app logs nothing, Kamal
          # reports success, and the only symptom is an empty Grafana. Print the state
          # on every deploy so "staging ships no telemetry" is a line you can read,
          # not a thing you have to go discover.
          #
          # Report only whether each secret is SET, never its value. These arrive from
          # `secrets.*`, and GitHub masks a secret's value anywhere in the log -- so
          # echoing the endpoint would print `***` and tell you nothing, while any
          # attempt to print a "safe substring" of the DSN would be one malformed value
          # away from leaking the whole thing. Set/unset is the entire question here
          # anyway; `bin/rails obs:status` on the box reports the endpoint.
          echo "--- observability preflight ---"
          if [ -n "${STAGING_OTEL_LOGS_EXPORTER_ENDPOINT:-}" ] && [ -n "${STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN:-}" ]; then
            echo "✅ OTLP logs ON (endpoint + bearer token set; deployment.environment=staging)"
          else
            echo "::warning::OTLP logs are OFF: set BOTH STAGING_OTEL_LOGS_EXPORTER_ENDPOINT and"
            echo "::warning::STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN. Either one missing is a silent no-op,"
            echo "::warning::and staging logs will never reach VictoriaLogs."
          fi
          if [ -n "${STAGING_SENTRY_DSN_BACKEND:-}" ]; then
            echo "✅ GlitchTip errors ON (DSN set -- it must be a STAGING-only project)"
          else
            echo "::warning::GlitchTip errors are OFF: STAGING_SENTRY_DSN_BACKEND is unset."
          fi
          # Same reasoning as above: an unset SSH key is survivable but invisible --
          # the app boots and only the ssh-* MCP servers fail, inside a session, with a
          # health-check error nobody is watching for.
          if [ -n "${STAGING_OPERATOR_SSH_KEY:-}" ]; then
            echo "✅ Session SSH identity ON (operator key set; decoded to ~/.ssh/zimmer_operator_ed25519 on boot)"
          else
            echo "::warning::Sessions will have NO SSH identity: STAGING_OPERATOR_SSH_KEY is unset,"
            echo "::warning::so every ssh-* MCP server fails its startup health check."
          fi
          # The Parameter Store resolver credential. Same reasoning again, and this one
          # is the most invisible of the lot: with it unset the app boots healthy, every
          # ${VAR} still resolves from staging.yml.enc, and the ONLY symptom is that the
          # first link of the chain silently never turns on. Set/unset is the whole
          # question -- the value is masked by GitHub anyway, and the store's address is
          # in env.clear in config/deploy.staging.yml, not here.
          if [ -n "${STAGING_ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON:-}" ]; then
            echo "✅ Parameter Store ON (resolver key set; reads /zimmer/staging/mcp/static/ in zimmer-secrets-staging)"
          else
            echo "::warning::Parameter Store is OFF: STAGING_ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON is unset."
            echo "::warning::Staging boots fine and every \${VAR} resolves from staging.yml.enc as before --"
            echo "::warning::the store link is simply absent. The Connectors page names the reason."
          fi
          echo "-------------------------------"
          kamal accessory boot all -d staging
          kamal deploy -d staging \
            --version="${{ steps.img.outputs.tag }}" \
            --skip-push

      # kamal-proxy already health-gated the cutover host-side. Re-verify from the
      # tailnet, and assert the WORKER is genuinely healthy too -- the worker is where
      # agent sessions actually execute, and mere presence in `docker ps` is not
      # enough: a worker crash-looping on a bad DB password still shows up there
      # (Restarting), so we assert Running AND a stable RestartCount.
      - name: Verify web + worker over the tailnet
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://${STAGING_HOST}/up" >/dev/null 2>&1; then
              echo "✅ web healthy at http://${STAGING_HOST}/up"
              echo "--- containers on the droplet ---"
              ssh root@"${STAGING_HOST}" 'docker ps --format "{{.Names}}\t{{.Status}}"'

              w=$(ssh root@"${STAGING_HOST}" \
                'docker ps --filter "name=zimmer-worker" --format "{{.Names}}" | head -1')
              if [ -z "$w" ]; then
                echo "::error::web is up but no worker container exists"
                exit 1
              fi
              # Settle, then require Running=true and no further restarts.
              r1=$(ssh root@"${STAGING_HOST}" "docker inspect -f '{{.RestartCount}}' $w")
              sleep 20
              state=$(ssh root@"${STAGING_HOST}" "docker inspect -f '{{.State.Running}}' $w")
              r2=$(ssh root@"${STAGING_HOST}" "docker inspect -f '{{.RestartCount}}' $w")
              echo "worker=$w running=$state restarts=$r1->$r2"
              if [ "$state" != "true" ] || [ "$r1" != "$r2" ]; then
                echo "::error::worker $w is not stably running (running=$state, restarts $r1->$r2)"
                ssh root@"${STAGING_HOST}" "docker logs --tail 40 $w" || true
                exit 1
              fi
              echo "✅ worker stably running"
              exit 0
            fi
            echo "waiting for app ($i/20)…"
            sleep 15
          done
          echo "::error::Health check did not pass in time"
          exit 1

      # The worker being "stably running" above says the container did not crash. It
      # says nothing about whether the thing this deploy turned on actually works, and
      # that distinction is the whole lesson of 2026-08-13: four green assertions about
      # the container's SHAPE while the queue sat frozen for ten hours.
      #
      # So assert the properties an agent session depends on, from inside the container,
      # as the uid a session runs as.
      - name: Verify the worker's nested Docker daemon
        if: ${{ inputs.nested_docker }}
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
        run: |
          set -euo pipefail
          w=$(ssh root@"${STAGING_HOST}" \
            'docker ps --filter "name=zimmer-worker" --format "{{.Names}}" | head -1')
          [ -n "$w" ] || { echo "::error::no worker container"; exit 1; }
          echo "worker: $w"

          # 1. The runtime Kamal actually started it under.
          rt=$(ssh root@"${STAGING_HOST}" "docker inspect -f '{{.HostConfig.Runtime}}' $w")
          if [ "$rt" != "sysbox-runc" ]; then
            echo "::error::worker runtime is '$rt', not sysbox-runc -- the deploy did not arm nested Docker."
            exit 1
          fi

          # 2. The user namespace. This is the fence: it is what makes running a daemon
          #    as container-root defensible, and its absence is the failure that would
          #    hand every agent session root on the droplet.
          map=$(ssh root@"${STAGING_HOST}" "docker exec $w head -1 /proc/self/uid_map")
          echo "worker uid_map: $map"
          if [ "$(echo "$map" | awk '{print $2}')" = "0" ]; then
            echo "::error::the worker is NOT user-namespaced: its root is host root."
            exit 1
          fi

          # 3. The host's socket must not be reachable. Nested Docker exists precisely so
          #    the worker does not need it -- a session with the host socket can start a
          #    container bind-mounting / as root, and can control its sibling containers.
          #    Captured first so the failure message can show what IS mounted; -x pins
          #    the match to a whole line, so a path merely containing docker.sock does
          #    not read as the host's socket. Both spellings, because /var/run is a
          #    symlink to /run on systemd hosts and a future regression could mount
          #    either -- this check exists to catch that, not just today's config.
          mounts=$(ssh root@"${STAGING_HOST}" \
            "docker inspect -f '{{range .Mounts}}{{println .Source}}{{end}}' $w")
          if printf '%s\n' "$mounts" | grep -qxE '/(var/)?run/docker\.sock'; then
            echo "::error::the worker mounts the HOST Docker socket. That is root-equivalent access to"
            echo "::error::the droplet from inside any agent session; nested Docker exists to avoid it."
            echo "--- worker mounts ---"
            printf '%s\n' "$mounts"
            exit 1
          fi

          # 4. The daemon answers as uid 1000 -- not as root. Agent sessions run as 1000
          #    after the entrypoint's privilege drop, so a root-only socket is a daemon
          #    that exists and that no session can use (this is what `dockerd --group
          #    1000` in bin/docker-entrypoint buys).
          v=$(ssh root@"${STAGING_HOST}" \
            "docker exec -u 1000:1000 $w docker version --format '{{.Server.Version}}'" 2>&1) || {
            echo "::error::the inner daemon is not usable as uid 1000, which is the uid agent sessions run as:"
            echo "::error::${v}"
            ssh root@"${STAGING_HOST}" "docker exec $w tail -20 /tmp/dockerd.log" || true
            exit 1
          }
          echo "✅ nested dockerd ${v} answering as uid 1000"

          # 5. The CONTAINER's HOME. PID 1 is docker-init (the role sets `init: true`), so
          #    this reads the environment Docker built from `--user` -- NOT the app's, and
          #    not one bin/docker-entrypoint has touched: docker-init never runs it.
          #
          #    That makes it the right thing to assert, because it is the environment
          #    nothing inherits from the entrypoint gets: every `docker exec` into the
          #    worker, and anything the app spawns that rebuilds a child environment from
          #    scratch. Under `user: "0:0"` Docker resolves it to /root, which at uid 1000
          #    is mode 0700 and root-owned -- untraversable, so libpq's probe of
          #    $HOME/.postgresql/postgresql.crt gets EACCES (fatal, unlike ENOENT) and
          #    ~/.claude and ~/.config/gh are simply absent. `ENV HOME=/home/rails` in the
          #    Dockerfile is what pins it independent of the uid the container starts as.
          #
          #    The app process is covered separately and more strongly: the entrypoint
          #    derives HOME from /etc/passwd and refuses to boot unless uid 1000 can
          #    traverse and write it, so a worker that reached step 4 above already proved
          #    that half. This is the half nothing else checks.
          home=$(ssh root@"${STAGING_HOST}" "docker exec $w cat /proc/1/environ" \
            | tr '\0' '\n' | sed -n 's/^HOME=//p')
          echo "worker PID 1 HOME=${home}"
          if [ "${home}" != "/home/rails" ]; then
            echo "::error::the worker's container HOME is '${home}', not /home/rails (read off PID 1,"
            echo "::error::which is docker-init and so carries what Docker derived from --user)."
            echo "::error::Every 'docker exec -u 1000' into this worker then runs with a HOME it cannot"
            echo "::error::traverse: libpq's TLS probe gets EACCES and ~/.claude, ~/.config/gh are absent."
            echo "::error::Pin it with ENV HOME=/home/rails in the Dockerfile rather than leaving Docker"
            echo "::error::to derive it from user: \"0:0\"."
            exit 1
          fi

          # And prove it is usable, as the uid agent sessions run as -- the same test the
          # entrypoint applies to itself before dropping privileges. A HOME that reads back
          # correctly but that uid 1000 cannot traverse and write fails in exactly the way
          # the string comparison above cannot see.
          #
          # ${home} needs no quoting hardening: it can only reach here as the literal
          # /home/rails, because the exact-string comparison above exits otherwise. Keep that
          # ordering if you touch this -- it is what makes the interpolation safe.
          #
          # Status and output are captured separately so a transport failure does not get
          # reported as an unusable directory: a dropped ssh, a stopped container and a
          # missing /usr/bin/test all exit nonzero here and have nothing to do with the mode
          # bits on ${home}.
          probe_rc=0
          probe_out=$(ssh root@"${STAGING_HOST}" \
            "docker exec -u 1000:1000 $w test -x '${home}' -a -w '${home}'" 2>&1) || probe_rc=$?
          if [ "${probe_rc}" -ne 0 ]; then
            echo "::error::the usability probe for HOME=${home} exited ${probe_rc}: ${probe_out:-<no output>}"
            echo "::error::If that is a plain nonzero with no output, uid 1000 -- the uid agent sessions"
            echo "::error::run as -- cannot traverse and write it, and libpq's TLS probe and every ~/ path"
            echo "::error::fail through it. Any other output is the probe failing to run at all."
            ssh root@"${STAGING_HOST}" "docker exec $w ls -ld '${home}'" || true
            exit 1
          fi
          echo "✅ worker is user-namespaced, socket-free, and its HOME is usable at uid 1000"

      # `/up` above is a liveness ping, not a health check: Rails answers it 200 for
      # any process that finished booting, so a container with a dead database, an
      # unreachable Redis, or a cache store that silently drops every write walks
      # straight through it. That is not hypothetical -- it is how a fully broken
      # deploy got declared healthy.
      #
      # So assert what a user would hit inside one page load. Every check here is a
      # HARD failure, unlike the telemetry probe below: a failure here is the app
      # not working, not a degraded side channel.
      #
      #   1. /up/deep       -- touches the database, the cache and Redis, and names
      #                        which one failed instead of collapsing them to one bit.
      #   2. GET /          -- a real page render (views, assets, a DB query), not a
      #                        200 from a controller that does nothing.
      #   3. CSRF round trip -- the session cookie and secret_key_base survived the
      #                        deploy. Without it every GET looks perfect while every
      #                        form in the UI 422s.
      #   4. /cable upgrade -- Turbo Streams can actually connect, which is how every
      #                        live update in this app arrives.
      - name: Smoke-test the deployed app (deep health, page render, CSRF, cable)
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
        run: |
          set -euo pipefail
          base="http://${STAGING_HOST}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          # --- 1. the deep health endpoint ------------------------------------
          code=$(curl -sS -o "${tmp}/deep.json" -w '%{http_code}' --max-time 20 "${base}/up/deep" || echo 000)
          echo "--- GET /up/deep -> ${code} ---"
          cat "${tmp}/deep.json" 2>/dev/null || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::/up/deep answered ${code}. The app booted, but something it cannot serve a page without did not:"
            echo "::error::the \"failed\" list in the body above names the component (database, cache, redis)."
            exit 1
          fi
          echo "✅ database, cache and Redis each answered a real round trip"

          # --- 2. a real page render ------------------------------------------
          code=$(curl -sS -o "${tmp}/home.html" -D "${tmp}/home.headers" -w '%{http_code}' --max-time 30 "${base}/" || echo 000)
          if [ "${code}" != "200" ]; then
            echo "::error::GET / answered ${code} -- the deployed app is serving errors on its own root page."
            head -c 2000 "${tmp}/home.html" 2>/dev/null || true
            exit 1
          fi
          echo "✅ GET / rendered (200)"

          # --- 3. a CSRF round trip -------------------------------------------
          # Rejected without a token, accepted with one. The target is a session id
          # that cannot exist, so the authorized request reaches the controller and
          # 404s having changed nothing.
          token=$(sed -n 's/.*<meta name="csrf-token" content="\([^"]*\)".*/\1/p' "${tmp}/home.html" | head -1)
          # name=value from each Set-Cookie, attributes and the header's CR dropped.
          cookie=$(grep -i '^set-cookie:' "${tmp}/home.headers" \
            | sed -E 's/^[Ss]et-[Cc]ookie: *([^;[:space:]]*).*/\1/' | paste -sd';' - || true)
          if [ -z "${token}" ] || [ -z "${cookie}" ]; then
            echo "::error::the root page came back without a CSRF token and/or a session cookie"
            echo "::error::(token: $([ -n "${token}" ] && echo present || echo MISSING), cookie: $([ -n "${cookie}" ] && echo present || echo MISSING))."
            echo "::error::Every form in the UI would 422. Check secret_key_base and the cookie store."
            exit 1
          fi

          probe="${base}/sessions/0/follow_up"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "${probe}" || echo 000)
          if [ "${code}" != "422" ]; then
            echo "::error::a POST with no CSRF token answered ${code}, expected 422 -- forgery protection is not enforcing."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "${probe}" \
            -H "Cookie: ${cookie}" -H "X-CSRF-Token: ${token}" || echo 000)
          if [ "${code}" != "404" ]; then
            echo "::error::a POST carrying the page's own CSRF token answered ${code}, expected 404 (that session id does not exist)."
            echo "::error::422 here means the token did not verify -- the session cookie is not surviving the round trip."
            exit 1
          fi
          echo "✅ CSRF round trip: rejected without a token, verified with one"

          # --- 4. the Action Cable upgrade ------------------------------------
          # Origin has to equal the scheme+host Rails sees. Staging runs assume_ssl,
          # so that is https:// even on this plaintext tailnet hop -- try both rather
          # than hard-code which one is in force.
          key=$(head -c 16 /dev/urandom | base64)
          upgraded=""
          out=""
          for origin in "https://${STAGING_HOST}" "http://${STAGING_HOST}"; do
            out=$(curl -sS -i --http1.1 --max-time 10 \
              -H "Connection: Upgrade" -H "Upgrade: websocket" \
              -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: ${key}" \
              -H "Origin: ${origin}" "${base}/cable" 2>&1) || true
            if grep -qi "^HTTP/1.1 101" <<<"${out}"; then
              upgraded="${origin}"
              break
            fi
          done
          if [ -z "${upgraded}" ]; then
            echo "::error::/cable did not upgrade to a WebSocket, so Turbo Streams cannot connect and every"
            echo "::error::live update in the UI (timelines, status badges, notification counts) is dead."
            echo "--- last /cable response ---"
            echo "${out:-<none>}" | head -20
            exit 1
          fi
          echo "✅ /cable upgraded to a WebSocket (origin ${upgraded})"

      # Prove the deployed container is ACTUALLY shipping logs, rather than trusting
      # that it must be because the secrets were set.
      #
      # The preflight above reports what the DEPLOY SHELL knows -- whether the two
      # secrets are non-empty. That is a strictly weaker claim than "logs reach
      # VictoriaLogs", and the gap between them is invisible by construction: the
      # exporter's background thread can only warn to stderr, so a bearer token that
      # Caddy rejects (401), a wrong endpoint path (404), and a collector that is
      # simply down all look identical from outside the box -- identical, in fact, to
      # a perfectly healthy staging that just had no errors to ship. Absence of data
      # is never evidence of absence of errors.
      #
      # `bin/rails obs:smoke` closes that gap from INSIDE the running container: it
      # performs a synchronous OTLP ingest probe and reports the collector's status
      # code, then exercises the real Rails.logger -> broadcast appender -> export
      # thread path. It prints no bearer token and no DSN, so its output is safe in a
      # public build log.
      #
      # Deliberately runs AFTER the cutover, not as a gate before it: the app is
      # already live and healthy at this point, and broken telemetry is not a reason
      # to withhold a good deploy. What it must not do is stay quiet -- so a
      # definitively misconfigured export (an HTTP rejection, or an exporter that is
      # OFF despite both secrets being set) fails the run, turning "staging silently
      # ships nothing" into a red X on the deploy that caused it.
      - name: Verify staging is shipping logs to the obs stack
        env:
          STAGING_HOST: ${{ steps.host.outputs.staging_host }}
          STAGING_OTEL_LOGS_EXPORTER_ENDPOINT: ${{ secrets.STAGING_OTEL_LOGS_EXPORTER_ENDPOINT }}
          STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN: ${{ secrets.STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          # Nothing configured, nothing to verify. A fork or self-hoster with no obs
          # stack must not have its deploy fail over telemetry it never asked for --
          # the preflight already warned that the export is off.
          if [ -z "${STAGING_OTEL_LOGS_EXPORTER_ENDPOINT:-}" ] || [ -z "${STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN:-}" ]; then
            echo "OTLP logs are not configured for this deploy; skipping the ingest probe."
            exit 0
          fi

          web=$(ssh root@"${STAGING_HOST}" \
            'docker ps --filter "name=zimmer-web" --format "{{.Names}}" | head -1')
          if [ -z "$web" ]; then
            echo "::error::no zimmer-web container to probe from"
            exit 1
          fi

          # Capture WITHOUT letting `set -e` abort on a non-zero rc. obs:smoke itself
          # only ever `puts` and exits 0 -- every misconfiguration it detects
          # (rejection, unreachable, exporter-off) is reported in its OUTPUT, which the
          # grep classification below is what reads. So a non-zero rc here is never the
          # probe's verdict; it means the harness around it failed to run: a transient
          # SSH drop, the container vanishing between the `docker ps` above and this
          # `docker exec`, or Rails failing to boot the rake process. Aborting at the
          # assignment (which `set -e` would do) would both swallow `$out` before it is
          # echoed AND fail a deploy that already passed the health-gated cutover --
          # exactly the "broken telemetry must not withhold a good deploy" intent this
          # step is built around, inverted. So keep the rc and classify on it below.
          echo "--- bin/rails obs:smoke (in $web) ---"
          out=$(ssh root@"${STAGING_HOST}" "docker exec \"$web\" bin/rails obs:smoke" 2>&1) && rc=0 || rc=$?
          echo "$out"
          echo "-------------------------------------"

          # An HTTP rejection is unambiguous misconfiguration: the collector answered,
          # and said no. 401 = the token does not match the ingest gateway's;
          # 404 = the endpoint path is wrong.
          if grep -q "rejected (HTTP" <<<"$out"; then
            echo "::error::staging's OTLP ingest was REJECTED by the collector -- see the status code above."
            echo "::error::401 -> STAGING_OTEL_LOGS_EXPORTER_BEARER_TOKEN does not match the obs ingest gateway."
            echo "::error::404 -> STAGING_OTEL_LOGS_EXPORTER_ENDPOINT path is wrong (want .../otel/v1/logs, no trailing slash)."
            exit 1
          fi

          # Both secrets are set, yet the app booted with the exporter disabled: the
          # values did not survive the trip through .kamal/secrets.staging into the
          # container. Precisely the silent drift this step exists to catch.
          if grep -q "exporter disabled" <<<"$out"; then
            echo "::error::both OTLP secrets are set, but the container's exporter is OFF."
            echo "::error::The values did not reach the app -- check env.secret in config/deploy.staging.yml"
            echo "::error::and the mapping in .kamal/secrets.staging."
            exit 1
          fi

          # No HTTP answer at all (DNS, timeout, firewall). The obs droplet being down
          # is not this deploy's fault and must not fail it -- but it is not a pass
          # either, so say so where it will be seen.
          if grep -q "rejected (error:" <<<"$out"; then
            echo "::warning::staging could not REACH the collector (no HTTP response). The obs stack may be down;"
            echo "::warning::staging's logs are being dropped until it is back."
            exit 0
          fi

          # Ingest was accepted (endpoint + token are good), but the async export
          # thread that ships the LIVE logger path is dead -- the synchronous probe
          # passed while `Rails.logger.error` records would queue and never ship. A
          # real degradation, so surface it; not this deploy's failure to fix, so warn
          # rather than fail.
          if grep -q "export thread is NOT running" <<<"$out"; then
            echo "::warning::OTLP ingest was accepted, but the exporter's async thread is not running --"
            echo "::warning::the synchronous probe ships, but live Rails.logger records do not. Check the"
            echo "::warning::web container's boot logs for an otel_logs_exporter thread crash."
            exit 0
          fi

          # The probe harness itself failed to run (SSH drop, container gone, Rails
          # boot failure) -- NOT a verdict on the ingest, since obs:smoke exits 0 for
          # every state it can actually diagnose. Don't fail the already-live deploy
          # over it; make the un-run probe visible so it is not read as a pass.
          if [ "$rc" -ne 0 ]; then
            echo "::warning::could not run the ingest probe (obs:smoke exited $rc before reporting a verdict)."
            echo "::warning::The deploy is already live and health-gated; telemetry was left UNVERIFIED, not confirmed broken."
            exit 0
          fi

          echo "✅ staging's OTLP ingest was accepted (deployment.environment=staging)"

  # Re-point the `staging.zimmer.tadasant.com` A record at the (possibly new) tailnet
  # IP and push a real cert. Without this, a freshly-provisioned droplet serves only
  # cloud-init's self-signed bootstrap cert and the A record still points at the old
  # box -- and APP_HOST is that domain, so every generated URL and OAuth callback
  # breaks. Idempotent: the script no-ops issuance when the cert is valid >30 days.
  cert:
    needs: deploy
    uses: ./.github/workflows/domain-cert-staging.yml
    secrets: inherit

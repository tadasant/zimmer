name: CI

# Standalone CI for the Zimmer Rails app. Every job runs on a GitHub-hosted runner, which
# is free and unmetered on a public repository. The Ruby jobs pin `ubuntu-24.04` rather
# than `ubuntu-latest`: ruby/setup-ruby builds only the newest patch of each Ruby series
# for a newer image, so on ubuntu-26.04 there is no 3.4.6 to install. The macOS jobs use
# `macos-latest`. `runs-on` is hard-coded, never switched by a variable: a fork PR must
# never be able to reach a self-hosted runner. Postgres + Redis come up as service
# containers on dynamic host ports, and ruby/setup-ruby installs Ruby and caches the bundle
# (`bundler-cache: true`) — no job relies on anything left on a runner by an earlier run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # pull-requests: read is for the vs-main step, which lists the PR's files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
      - name: Rubocop
        run: bin/rubocop -f github --parallel
      # The two-phase-drop guard is Rails-free by design, so it runs here as
      # well as inside `bin/rails test` — this job has no Postgres and no Redis,
      # and answers in seconds instead of after a full suite boot. It covers
      # forward column drops, column and table renames, and table drops. See
      # docs/operate/deploying.md, "Dropping a column takes two deploys" and
      # "Renames and table drops expand before they contract".
      - name: Migration drop/rename guard
        run: |
          bundle exec ruby -r./test/support/two_phase_column_drop_guard \
            -e 'report = TwoPhaseColumnDropGuard.report; abort(report) unless report.empty?'
      # Same reasoning as above: InertSubprocessTimeoutGuard is Rails-free, so it
      # answers here in seconds rather than after a full suite boot. See
      # docs/operate/background-jobs.md, "`Timeout.timeout` around
      # `Open3.capture3` bounds nothing".
      - name: Inert subprocess timeout guard
        run: |
          bundle exec ruby -r./test/support/inert_subprocess_timeout_guard \
            -e 'report = InertSubprocessTimeoutGuard.report; abort(report) unless report.empty?'
      # Two migrations sharing a version kill the suite inside
      # `maintain_test_schema!`, before any test runs, and reach production
      # runtime the same way. Detecting it needs no database and no Rails —
      # which is the point, since the failure it guards against is a Rails boot
      # failure. Seconds here beats several minutes in `test-unit`.
      - name: Duplicate migration version guard
        run: |
          bundle exec ruby -r./test/support/migration_version_guard \
            -e 'report = MigrationVersionGuard.report; abort(report) unless report.empty?'
      # The step above reads the merge with `main` as of this PR's last push. A
      # PR that merges days later can still collide with a migration `main`
      # gained in between (#1483/#1484, zimmer#1500), so this re-reads `main` as
      # it is when the job runs. The other half is migration-versions-vs-main.yml,
      # which re-asks every open PR each time `main` gains a migration.
      - name: Migration versions vs current main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          ruby .github/scripts/migration-versions-vs-main.rb check --pr "$PR_NUMBER" --main-ref origin/main

  security:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman --no-pager -q

  verify_lockfile:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          # No install: `bundle lock` only resolves, and a cached bundle restored from
          # the very lockfile under test would prove nothing about it.
          bundler-cache: false
      - name: Ensure Gemfile.lock is up to date
        run: |
          bundle lock
          git diff --exit-code Gemfile.lock

  # Unit + integration suite (system tests are excluded — `bin/rails test` does not
  # descend into test/system; the Chrome-driven suite runs in the separate `test-system`
  # job below). PARALLEL_WORKERS matches the 4 vCPUs of a standard hosted Linux runner.
  #
  # Split across a matrix, which costs nothing on a public repo: on one 4-vCPU runner the
  # suite takes about ten minutes, twice what it did on the old 32-core box. Each shard runs
  # every SHARD_TOTAL-th file of the list `bin/rails test` would load by default (same glob,
  # same exclusions), so the shards cover the suite exactly once between them. `all-checks-pass`
  # needs `test-unit`, which means every shard.
  test-unit:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # One shard failing must not cancel the other: its own failures are the ones you need next.
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zimmer_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      # config/environments/test.rb ties `config.eager_load` to ENV["CI"]. Without it,
      # eager loading is off and lazy autoload trips over good_job's Zeitwerk layout
      # (GoodJob::Job) at runtime. GitHub-hosted runners export CI=true already; it is
      # stated here because the suite depends on it.
      CI: true
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      PARALLEL_WORKERS: 4
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 2

    steps:
      - uses: actions/checkout@v4
      - name: Resolve dynamic service ports
        run: |
          echo "DATABASE_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports[6379] }}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:test:prepare
      # `bin/rails test` with explicit files skips `test:prepare`, and tailwindcss-rails
      # builds the stylesheet every rendered page links as part of it. Run it here, so a
      # shard prepares exactly what an unsharded `bin/rails test` would.
      - name: Prepare test assets (test:prepare)
        run: bin/rails test:prepare
      - name: Run this shard's tests (unit + integration; system tests excluded)
        run: |
          set -euo pipefail
          # The default glob and exclusions of Rails::TestUnit::Runner, sorted, then every
          # SHARD_TOTAL-th file starting at this shard's offset.
          mapfile -t files < <(ruby -rrake -e '
            files = Rake::FileList["test/**/*_test.rb"].exclude("test/{system,dummy,fixtures}/**/*_test.rb").to_a.sort
            index, total = Integer(ENV.fetch("SHARD_INDEX")), Integer(ENV.fetch("SHARD_TOTAL"))
            puts files.select.with_index { |_, i| i % total == index - 1 }')
          # An empty shard would run `bin/rails test` with no arguments, which is the WHOLE suite
          # — or, if that ever changed, nothing at all and a green job.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Shard ${SHARD_INDEX}/${SHARD_TOTAL} selected no test files."
            exit 1
          fi
          echo "Shard ${SHARD_INDEX}/${SHARD_TOTAL}: ${#files[@]} test files"
          bin/rails test "${files[@]}"

  # Chrome-driven system tests (test/system/*.rb), the browser suite `bin/rails test`
  # never descends into. Ported from the AO parent's `test-system` job. Kept a SEPARATE
  # job (not folded into test-unit) because `PARALLEL_WORKERS` is pinned to 1 here — the
  # persistent per-worker `--user-data-dir` in test/application_system_test_case.rb does not
  # tolerate concurrent Chrome instances (higher worker counts fail with "Chrome instance
  # exited") — and running beside test-unit costs no wall-clock.
  #
  # The browser is the Google Chrome the hosted ubuntu image ships, named through CHROME_BIN
  # (application_system_test_case.rb runs it with --no-sandbox under CI). Selenium Manager
  # resolves the matching chromedriver.
  #
  # The JS Playwright scripts under test/e2e/*.js are NOT run here: AO never ran them in CI
  # either, they are self-described standalone runners, they need a Playwright browser
  # install the runner is not provisioned for, and account_rotation_test.js needs the real
  # Claude Code binary + a mock Anthropic server. Deferred — tracked in issue #162.
  test-system:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zimmer_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      # See the test-unit job: config/environments/test.rb ties eager loading (and the
      # system suite's Chrome sandbox flag) to ENV["CI"].
      CI: true
      CHROME_BIN: /usr/bin/google-chrome
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      # The persistent per-worker Chrome profile does not survive concurrent workers;
      # pin to 1 so the suite runs effectively serial. See the job comment above.
      PARALLEL_WORKERS: 1

    steps:
      - uses: actions/checkout@v4
      - name: Resolve dynamic service ports
        run: |
          echo "DATABASE_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports[6379] }}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:test:prepare
      # System tests render real pages, so Tailwind's stylesheet must be compiled into
      # app/assets/builds (git-ignored) before the suite drives a browser against it.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build
      - name: Run system tests
        run: bin/rails test:system
      # Rails writes a PNG per failing system test to `Capybara.save_path`, which
      # `capybara/rails` points at tmp/capybara (it falls back to tmp/screenshots only
      # when save_path is unset, which `require "capybara/rails"` never leaves it).
      # Both are listed so the artifact survives either way. Without the screenshot, a
      # failure that only reproduces on the runner is undebuggable from the log alone.
      #
      # Runs on success too: a test may deliberately save a `proof-*.png` of a UI it
      # just exercised, and an agent session has no local Postgres to drive the app
      # against — CI's Chrome is the only place a screenshot for a PR can come from.
      - name: Upload system test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: |
            tmp/capybara/
            tmp/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # The round-trip schema check: migrate a scratch database from zero and dump it,
  # load the committed db/schema.rb into another and dump that, then diff. Every
  # other job here *loads* the schema (`bin/rails db:test:prepare`) and none of them
  # migrates, so without this job a schema.rb that disagrees with db/migrate/ is
  # green all the way to whoever next runs `db:migrate` against an empty database.
  # That is not hypothetical: it is how #311 shipped two `sessions` columns no
  # migration created, and how `logs.session_id` was a `bigint` in the migrations
  # and an `integer` in every database that exists.
  #
  # A separate job rather than a step in test-unit: it drops and recreates the
  # databases several times, which would destroy the suite's own. Its Postgres
  # service is therefore its own scratch container, on a dynamic host port like
  # every other job here. No Redis — the test environment does not
  # use it (config/environments/test.rb), and nothing here boots a cache store.
  #
  # Deliberately does NOT set CI=true, unlike test-unit and test-system. That
  # variable only turns on eager loading in the test environment, and eager loading
  # the app while migrating from zero means model code meeting a half-built schema.
  # This job reproduces exactly what a developer runs locally.
  #
  # See docs/operate/testing.md and lib/schema_verify_task.rb.
  schema_verify:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zimmer_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      # Asserted, not just written: config/database.yml defaults DATABASE_PORT to
      # 5432, and this is the only job in the file that runs an unconditional
      # `db:drop`. An empty expansion here would point it at whatever Postgres
      # answers on the runner's localhost:5432.
      - name: Resolve dynamic service ports
        run: |
          port="${{ job.services.postgres.ports[5432] }}"
          [ -n "$port" ] || { echo "::error::no dynamic Postgres port for the service container"; exit 1; }
          echo "DATABASE_PORT=$port" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
      - name: Round-trip db/schema.rb against db/migrate
        run: bin/rails db:schema:verify

  # Builds the Astro Starlight documentation site in docs/. Keeps the site from
  # silently rotting: a broken link, bad frontmatter, or a page missing from the
  # sidebar fails here rather than at deploy time. No Ruby needed — this is the
  # one Node-only job.
  docs_site:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs

  # The documentation site is single-source: docs/ in this repo, built by Cloudflare
  # Pages. It must never ALSO be bundled into the published application image, where it
  # would be a second, drift-prone copy that nobody deploys and nobody keeps true.
  #
  # This job builds Dockerfile.docs-audit -- busybox plus `COPY . /ctx` -- against the
  # REAL build context and runs scripts/assert-docs-excluded.sh inside it. `Dockerfile`
  # runs the SAME script against /rails in its final stage, which is the direct assertion
  # against the published image and the one that stops a bad image from being pushed; PR
  # CI does not build the app image, so this job buys that signal before merge for a few
  # megabytes instead of a multi-GB zimmer-base pull.
  #
  # See docs/operate/deploying.md, "The docs never ship in the image".
  image_excludes_docs:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert the docs site is absent from the image build context
        run: docker build --no-cache --file Dockerfile.docs-audit --tag zimmer-docs-audit:${{ github.run_id }} .
      - name: Remove the audit image
        if: always()
        run: docker image rm --force zimmer-docs-audit:${{ github.run_id }} || true

  # The mirror image of image_excludes_docs: extensions must never STOP shipping. An
  # extension only does anything in the container that runs it, and the invariant rests
  # on .dockerignore NOT excluding app/extensions/ -- an absence, which is the hardest
  # kind of thing to notice going missing. It regressed once, silently, and stayed
  # regressed (tadasant/zimmer#91).
  image_includes_extensions:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert the extension tree is present in the image build context
        run: docker build --no-cache --file Dockerfile.extensions-audit --tag zimmer-extensions-audit:${{ github.run_id }} .
      - name: Remove the audit image
        if: always()
        run: docker image rm --force zimmer-extensions-audit:${{ github.run_id }} || true

  # Standalone unit tests for the GHCR retention selector. Pure Ruby, no Rails
  # boot required, so it runs fast and independently of the app suite.
  retention_logic:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
      - name: Test GHCR retention selection logic
        run: ruby scripts/ghcr_retention_test.rb

  # ShellCheck over every tracked *.sh file.
  #
  # The scripts under scripts/ are not conveniences: clear-root-password-expiry.sh rewrites
  # root's password ageing, tailnet-reap-node.sh removes tailnet nodes, worker-watchdog.sh
  # `kill -9`s container shims and `rm -rf`s containerd task directories, and
  # install-worker-watchdog.sh writes systemd units. All four run as root on the droplets,
  # over SSH, from the deploy path. `bash -n` proves only that they parse.
  #
  # --severity=info, NOT `warning`. SC2086 -- an unquoted expansion, the defect class that
  # turns `rm -rf $dir/foo` into `rm -rf /foo` when $dir is empty -- is an INFO-level check.
  # A script whose only content is `d=$1; rm -rf $d/foo` produces zero findings at
  # `--severity=warning` and one at `--severity=info`. A `warning` floor here would be a job
  # that reports success while ignoring the thing it was added to catch. The tree is in fact
  # clean at `--severity=style` as well, so tightening further is a one-word change.
  #
  # The binary is a pinned, checksummed static release rather than the image's own
  # shellcheck, an apt package or a marketplace action: a hosted image updates its tools
  # without notice, and pinning the version keeps a new upstream release from failing
  # unrelated PRs. The checksum is what makes the download safe to trust. Every hosted
  # runner starts cold, so fetch-pinned-download.sh retries for at most ten minutes and
  # then fails: a sustained outage must not skip the check.
  #
  # Scope is tracked *.sh, which is scripts/, .github/scripts/ and .agent-containers/ --
  # broader than scripts/ alone because .github/scripts/*.sh are deploy-path scripts too, and
  # at no cost, since the whole set is already clean. The extensionless bash under bin/
  # (bin/dev, bin/docker-entrypoint, ...) is NOT covered; bringing it in needs edits to the
  # production container entrypoint, which does not belong in a CI-hygiene change. Neither are
  # the `run:` blocks in this directory, which are bash but not files -- linting those means
  # extracting them from the YAML first.
  shellcheck:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHELLCHECK_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=x86_64;  sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 ;;
            aarch64) arch=aarch64; sha=324a7e89de8fa2aed0d0c28f3dab59cf84c6d74264022c00c22af665ed1a09bb ;;
            *) echo "::error::No pinned shellcheck build for $(uname -m)"; exit 1 ;;
          esac
          # `:?`, not plain expansion: `set -u` catches an UNSET RUNNER_TEMP but not an empty
          # one, and `rm -rf "$dir"` two lines down is exactly the shape this job exists to catch.
          dir="${RUNNER_TEMP:?}/shellcheck"
          rm -rf "$dir"; mkdir -p "$dir"
          .github/scripts/fetch-pinned-download.sh \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz" \
            "$sha" "$dir/shellcheck.tar.xz"
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir" --strip-components=1
          echo "$dir" >> "$GITHUB_PATH"
      - name: ShellCheck every tracked shell script
        run: |
          set -euo pipefail
          shellcheck --version

          mapfile -t files < <(git ls-files '*.sh')

          # A lint job whose file list is empty passes forever while verifying nothing. Refuse
          # to report success on an empty set.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No tracked *.sh files matched -- this job would have linted nothing."
            exit 1
          fi

          # The same failure in a subtler form: the glob still matches something, but no longer
          # the root-privileged scripts this job exists for. Name them, so a rename that moves
          # one out of coverage fails here instead of going unnoticed.
          for required in \
            scripts/clear-root-password-expiry.sh \
            scripts/tailnet-reap-node.sh \
            scripts/worker-watchdog.sh \
            scripts/install-worker-watchdog.sh \
            scripts/install-needrestart-sysbox-dropin.sh \
            scripts/install-cloudflared.sh; do
            case " ${files[*]} " in
              *" $required "*) ;;
              *)
                echo "::error::${required} is not in the lint set. If it was renamed, update this"
                echo "::error::job's required-file list; if it was deleted, drop it from the list."
                exit 1
                ;;
            esac
          done

          # The third way to pass while checking nothing, and the one a future change is most
          # likely to reach for: a repo-root .shellcheckrc, or a file-level `# shellcheck
          # disable=` sitting above a script's first command, either of which switches checks
          # off wholesale while this job stays green. Per-site directives are fine and are what
          # the scripts use -- they sit against one statement and carry their reason.
          if git ls-files --error-unmatch .shellcheckrc >/dev/null 2>&1; then
            echo "::error::A tracked .shellcheckrc can disable checks repo-wide while this job"
            echo "::error::stays green. If that is genuinely wanted, say so here first."
            exit 1
          fi
          for f in "${files[@]}"; do
            if awk '/^[[:space:]]*(#|$)/ { if ($0 ~ /shellcheck[[:space:]]+disable=/) found=1; next }
                    { exit } END { exit !found }' "$f"; then
              echo "::error::${f} carries a file-level \`# shellcheck disable=\` above its first"
              echo "::error::command, which switches those checks off for the whole file. Move it"
              echo "::error::next to the one statement it excuses."
              exit 1
            fi
          done

          echo "Linting ${#files[@]} shell scripts at --severity=info:"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=info --color=always "${files[@]}"

      - name: Test the CI failure alert's runner-loss re-run
        # alert-ci-failure.yml only runs from main, after a real runner loss, so its re-run
        # and paging decisions are exercised here against a stub `gh` instead.
        run: bash .github/scripts/rerun-unacquired-jobs_test.sh

      - name: Test the pinned download's retry, cache and checksum
        run: bash .github/scripts/fetch-pinned-download_test.sh

  ios-changes:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only, and stated rather than inherited: this job asks the API a question and
    # writes nothing anywhere.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      # The UI test files this change touches, space-separated, so the `ios` job's smoke run
      # also runs the classes they declare. Empty whenever the answer above was a guess.
      ui_tests: ${{ steps.filter.outputs.ui_tests }}
    steps:
      - name: Look for changes under ios/
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `.files[]?` rather than `.files[]`: the compare endpoint omits `files` entirely
          # on a diff over 300 files, and iterating null would abort the job.
          if [ -n "${PR_NUMBER:-}" ]; then
            endpoint="repos/${REPO}/pulls/${PR_NUMBER}/files"; filter='.[].filename'
          elif [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            endpoint="repos/${REPO}/compare/${BEFORE}...${SHA}"; filter='.files[]?.filename'
          else
            endpoint=""
          fi

          # Every way of NOT getting an answer lands here, and the answer it gives is
          # "build". This job exists to save free minutes, so an unnecessary macOS run
          # costs nothing that matters — while a job that fails, or that guesses `false`,
          # either reddens the branch for a reason unrelated to the code or silently skips
          # the only compiler this app has. Fail towards building.
          #
          # An EMPTY result counts as not getting an answer too, which is the case the `?`
          # above would otherwise swallow in silence: `compare` drops `files` on a diff over
          # 300, so the biggest pushes — the ones most likely to touch `ios/**` — are exactly
          # the ones that would come back looking like they changed nothing at all.
          if [ -z "$endpoint" ] || ! files=$(gh api --paginate "$endpoint" --jq "$filter") \
             || [ -z "$files" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine the changed files; building the iOS app rather than guessing."
            exit 0
          fi

          printf '%s\n' "$files" | sed 's/^/  /'
          ui_tests="$(printf '%s\n' "$files" | grep -E '^ios/App/ZimmerUITests/[A-Za-z0-9_]+\.swift$' | tr '\n' ' ' || true)"
          echo "ui_tests=${ui_tests% }" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | grep -qE '^(ios/|\.github/workflows/(ci|testflight|ios-ui-tests)\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  # The iOS app, compiled by Xcode for the simulator. Mirrors tadasant/motet's `ios` job.
  #
  # `xcodebuild` needs a Mac, and GitHub's hosted macOS runners are free on a public repo,
  # which is what makes the app buildable in CI with nobody having to own a Mac.
  #
  # NOTHING HERE SIGNS WITH AN IDENTITY, and that is the property to preserve. A simulator
  # build and an ad hoc signed device archive need no certificate, no provisioning profile
  # and no App Store Connect key, so this job holds no credential and needs no human in the
  # loop — which is the only reason it can run on every PR. Real signing and the TestFlight
  # upload live in `testflight.yml`, behind a `main`-only environment; do not add them here.
  # Which entitlements are signed in is decided by `ios/bin/testflight`'s guard, not here.
  ios:
    if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.ios-changes.outputs.ios == 'true' }}
    needs: ios-changes
    runs-on: macos-latest
    # About 25 minutes: an archive, the ZimmerKit tests, one simulator build and the smoke
    # run, most of them before the first UI test on a hosted runner. The headroom is for a pull
    # request that touches several UI test files, whose classes the smoke run adds whole: six of
    # them did not fit in 45 minutes, twice, with no test failed. So this is the budget of
    # `ios-ui-tests.yml`, which runs the same classes. A job cut off here fails `all-checks-pass`,
    # but the run concludes `cancelled`, so on `main` it pages nobody (see Known limitations).
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        # Which Xcode a hosted runner ships changes without notice, and a Swift-version
        # difference is the first thing to suspect when this job disagrees with a laptop.
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep -i '^Xcode' || true

      - name: Test the App Store Connect helper's export retry
        # What `testflight.yml` retries and what it never does, against a stand-in
        # xcodebuild and a stubbed App Store Connect. Stdlib only, no credential.
        run: python3 -m unittest discover -s ios/tools -v

      - name: Archive the app for a device, signed ad hoc, and check it is uploadable in shape
        # The credential-free half of `testflight.yml`, run by the same script: the Release
        # configuration, the device SDK, the app icon and the Info.plist keys App Store
        # Connect reads. Without it the first place any of those is checked is an upload,
        # which needs the Apple key and a human to notice it failed.
        run: ios/bin/testflight check

      - name: Archive it again with push on, and check both entitlements are signed in
        # The merged Push + CarPlay entitlements path, which no TestFlight run takes until
        # `ZIMMER_IOS_PUSH_ENABLED` is set. Proven here first, so setting it is not the test.
        env:
          ZIMMER_IOS_PUSH_ENABLED: "1"
        run: ios/bin/testflight check

      - name: Run the ZimmerKit tests against Apple's toolchain
        # The same script `bin/ci` calls on Linux — it picks up whichever Swift is on PATH,
        # which here is Xcode's. So this asserts nothing new about the logic and everything
        # about the *toolchain*: a difference from the Linux run is itself the finding. It
        # also builds `ZimmerPlatform` for macOS, the only place outside the app target that
        # a compiler is pointed at the AVFoundation half.
        run: ios/bin/ci-swift

      - name: Build the app for the simulator and smoke-test it
        # THE ONLY STEP THAT RUNS THE APP, and the simulator build of record: there is no
        # separate `ios/bin/build-app` step, because this builds the same app for the same
        # SDK on the way to running it. It drives the Debug-only fixture (an in-memory
        # Zimmer: an agent cannot complete a Google sign-in) through `--smoke`: the session
        # list, the build reporting the environment and server it was built with, and a
        # session started from a sentence and opened — plus every class in a UI test file this
        # change touches, so a new or edited UI test is proven before it merges. It records
        # a video and a picture of the last screen; there is no photograph pass.
        #
        # The other UI tests and the photographs of every key screen are
        # `ios-ui-tests.yml`, on every merge to `main` that touches `ios/**`: some 110 tests
        # driven one at a time, as five shards of up to 45 minutes — too long to gate every
        # pull request on.
        # To get them for a branch before it merges:
        #   gh workflow run ios-ui-tests.yml --ref <branch>
        #
        # `Staging` with a base URL is deliberate: one run proves the staging build variant
        # resolves the server it was given as well as the screens. The host is a
        # reserved-by-RFC-2606 name that can never resolve — the fixture makes no request —
        # because this repository names no deployment, not even in a workflow file.
        #
        # The file list arrives through `env:`, never pasted into the shell line, and the
        # script only reads class names out of files under ios/App/ZimmerUITests.
        env:
          UI_TEST_FILES: ${{ needs.ios-changes.outputs.ui_tests }}
        run: |
          set -euo pipefail
          also=()
          for f in $UI_TEST_FILES; do also+=(--also "$f"); done
          ios/bin/ui-test --smoke \
            --configuration Staging \
            --api-base-url https://ui-test.invalid \
            --artifacts "$RUNNER_TEMP/ui-test" \
            ${also[@]+"${also[@]}"}

      - name: Keep what the run produced
        # `always()`: a red run is the one whose video, screenshot and result bundle
        # somebody needs, and nobody here has a Mac to reproduce it on.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test
          path: ${{ runner.temp }}/ui-test
          retention-days: 14
          if-no-files-found: warn

  # The CarPlay drill: Zimmer opened in the iOS Simulator's CarPlay window and driven through
  # the car app (#1410): one Talk button; a Live call that cannot connect, its retries
  # putting the call screen up and down, giving up with no call screen left behind, a tap
  # that tries again — failing on any crash. XCUITest cannot reach a real head unit, but it can
  # reach the Simulator's CarPlay window, which `ios/bin/ui-test --carplay` opens from the
  # Simulator's own menu. A job of its own rather than a step in `ios`, because the drill's
  # build is signed ad hoc with the CarPlay entitlement (the CarPlay window lists no app
  # without one) and so cannot share the smoke run's unsigned build; in parallel, it costs
  # no wall-clock. Gated, fork-guarded and path-filtered exactly like `ios`.
  ios_carplay:
    if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.ios-changes.outputs.ios == 'true' }}
    needs: ios-changes
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Drive Zimmer in the Simulator's CarPlay window
        run: |
          ios/bin/ui-test --carplay --only CarPlayDrillUITests --no-photos \
            --configuration Staging \
            --api-base-url https://ui-test.invalid \
            --artifacts "$RUNNER_TEMP/carplay-drill"

      - name: Keep what the run produced
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-carplay-drill
          path: ${{ runner.temp }}/carplay-drill
          retention-days: 14
          if-no-files-found: warn

  # ZimmerKit — the iOS app's Foundation-only logic — built and tested on Linux, the way
  # Motet's `bin/ci` does it. It proves the package stays free of Apple-only imports, so its
  # rules are testable without a Mac, and it is the cheap half: the macOS `ios` job runs the
  # same tests against Xcode's toolchain. Gated on `ios-changes` like `ios`.
  ios_swift_linux:
    if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.ios-changes.outputs.ios == 'true' }}
    needs: ios-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain from ios/bin/install-swift-toolchain, not whatever Swift the
      # hosted image happens to ship: the image updates its tools without notice. About
      # 1 GB, so it is kept in the Actions cache, keyed on the script that pins it.
      - name: Restore the pinned Swift toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swift
          key: swift-${{ runner.os }}-${{ hashFiles('ios/bin/install-swift-toolchain') }}
      - name: Install the pinned Swift toolchain
        run: |
          set -euo pipefail
          # Ahead of the image's own `swift` on PATH, which is the one ci-swift picks first.
          ios/bin/install-swift-toolchain "${RUNNER_TEMP:?}/swift" >> "$GITHUB_PATH"
      - name: Build and test ZimmerKit
        run: ios/bin/ci-swift

  # Single aggregate gate for branch protection. Set THIS job's name — `all-checks-pass`
  # — as the one required status check under Settings → Branches → main, instead of
  # enumerating every job above. It `needs:` every required job and re-derives a pass/fail
  # from their results.
  #
  # Three properties make it a correct gate:
  #   1. `if: ${{ !cancelled() }}` — it still runs when a *dependency* fails (a plain
  #      `needs:` job is skipped when any dependency fails, which would leave the required
  #      check perpetually "skipped"), but it does NOT run when the whole run is cancelled.
  #      `always()` would be wrong here: this workflow sets `cancel-in-progress: true`, so
  #      every superseded run would execute this job, see `cancelled` in needs.*.result, and
  #      exit 1 — converting a cancelled run into a *failed* one and tripping the CI-failure
  #      alert, which deliberately stays quiet on `cancelled`. It carries no fork-guard `if:`.
  #   2. It passes on an allowlist, never a denylist: every dependency must report
  #      `success` or `skipped`, and anything else fails it. GitHub reports more results
  #      than it documents: a hosted job that no runner ever picks up comes through as
  #      `abandoned` in needs.*.result ("The job was not acquired by Runner of type hosted
  #      even after multiple attempts", which a macOS arm64 capacity shortage causes; the
  #      UI and jobs API show it as `cancelled`). A gate that
  #      looked only for `failure` and `cancelled` passed run 40899943842 with an `ios`
  #      job that never ran.
  #   3. `skipped` dependencies do NOT fail it and are NOT counted as passes: the several
  #      jobs above carry fork-guard `if:` conditions and report `skipped` on fork PRs.
  #      A fork PR therefore sees every job skip and this gate go green — the same
  #      fork tradeoff the individual jobs already make; trusted branches run everything.
  #      (This job has no checkout step, so a fork PR never executes fork code here.)
  all-checks-pass:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - lint
      - security
      - verify_lockfile
      - test-unit
      - test-system
      - schema_verify
      - docs_site
      - image_excludes_docs
      - image_includes_extensions
      - retention_logic
      - shellcheck
      # The iOS jobs skip on a change that does not touch ios/**; a skip is a non-answer,
      # not a pass, which is the property described above.
      - ios-changes
      - ios
      - ios_carplay
      - ios_swift_linux
    steps:
      - name: Verify every required check succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # An empty list would loop zero times and pass; it can only mean the expression broke.
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No dependency results to check."
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A required CI check reported '${result}', not success or skipped. Results: ${RESULTS}"
                exit 1 ;;
            esac
          done
          echo "All required CI checks passed (skipped jobs are allowed: fork guards, the iOS path filter)."

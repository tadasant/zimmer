# Kamal production destination. Merged over config/deploy.yml.
# Secrets are read from .kamal/secrets.production.
#
# Production deploys are orchestrated from a private companion repo (which
# holds the prod Terraform state, tfvars, and secrets); this file is public-safe
# because every environment-specific value comes in through ENV at deploy time.
#
# PRODUCTION_HOST is the droplet's tailnet address (resolved by the deploy workflow
# from `tailscale status`). PRODUCTION_DB_HOST/PORT are the Managed Postgres private
# host/port, fed from `terraform output`.
servers:
  web:
    hosts:
      - <%= ENV["PRODUCTION_HOST"] %>
    options:
      init: true
      volume:
        # Durable named volumes shared by web + worker, surviving Kamal deploys.
        # Every runtime's own conversation state belongs here: Claude Code keeps its
        # transcripts under ~/.claude, Codex keeps its rollouts (plus auth.json and the
        # thread store) under CODEX_HOME. A runtime home left on the container layer is
        # destroyed by each deploy, which makes the next `resume` fail with "no rollout
        # found" and restarts the conversation from zero.
        #
        # Pi is the exception that still gets a mount: its TRANSCRIPT lives inside the
        # session's own clone (PiRuntimeAdapter passes --session-dir), so it is durable
        # via zimmer_data above. PI_CODING_AGENT_DIR holds its credential and provider
        # state instead — auth.json, models.json, settings.json — which is milder to
        # lose but just as invisible, so it is mounted on the same terms.
        - zimmer_data:/home/rails/.zimmer
        - claude_home:/home/rails/.claude
        - codex_home:/home/rails/.codex
        - pi_home:/home/rails/.pi/agent
        - gh_config:/home/rails/.config/gh
        - claude_local:/home/rails/.local
        # The PRODUCTION catalog + its encrypted credentials, delivered to the host by
        # artifacts-sync-prod and bind-mounted read-only into BOTH roles. Persistent
        # host paths, so they survive Kamal deploys (unlike the old docker-cp-into-the
        # -container mechanism, which every deploy wiped). AIR_CONFIG (below) points
        # the app at the mounted catalog.
        - /opt/zimmer/catalog:/rails/catalog:ro
        - /opt/zimmer/credentials:/rails/config/credentials:ro
  worker:
    hosts:
      - <%= ENV["PRODUCTION_HOST"] %>
    cmd: bundle exec good_job start
    proxy: false
    options:
      init: true
      # Nested Docker, off by default. ZIMMER_NESTED_DOCKER=1 at deploy time runs this
      # role under sysbox, which gives the container its own user namespace, and starts
      # it as (namespaced) root so the entrypoint can bring up an inner dockerd before
      # dropping back to uid 1000. Unset, both values are exactly what Docker would do
      # anyway, so a host without sysbox installed deploys unchanged.
      #
      # The switch is deliberately one variable rather than three: a host with the
      # runtime but not the user, or the user but not the env, fails in ways that look
      # like an app bug. See docs/operate/nested-docker.md.
      runtime: <%= ENV["ZIMMER_NESTED_DOCKER"] == "1" ? "sysbox-runc" : "runc" %>
      # Quoted: YAML reads a bare 0:0 as a sexagesimal integer and hands Kamal `0`,
      # which is uid 0 with the image's default gid -- close enough to look right and
      # wrong in a way nothing would report.
      user: "<%= ENV["ZIMMER_NESTED_DOCKER"] == "1" ? "0:0" : "1000:1000" %>"
      # The droplet is 16 GB with no swap, and this role is the only one that runs
      # arbitrary work: agent sessions, and jobs whose peak allocation is a function of
      # the data they touch rather than of anything this config knows. Uncapped, an
      # overshoot is a GLOBAL out-of-memory event -- the kernel takes victims across every
      # cgroup, so sshd and Caddy lose their working set and the droplet stops answering
      # SSH and HTTPS. It looks exactly like a dead box, and it is not.
      #
      # That is not hypothetical here. #449 measured this worker on 2026-08-14 climbing
      # from ~700 MB at rest to 11.6 GB RSS in ~18 minutes under 10-13 concurrent sessions,
      # which took the host to 139 MB available with 40% iowait and load 13.57 on 8 vCPU.
      # For minutes the whole box thrashed: single-row SELECTs took 31s, the queue backed
      # up until it paged, and every agent session slowed down. Then the process died
      # anyway, around 20 minutes in, taking every session's child process with it.
      #
      # So the choice is not "restart or no restart" -- #449 restarts it either way. It is
      # whether the restart is preceded by minutes of host-wide thrash. The cap buys the
      # second: the kill lands in this cgroup, at a moment of this config's choosing,
      # before the host has degraded at all. Everything else on the droplet -- web, redis,
      # devdb, kamal-proxy, and above all sshd -- keeps its memory and stays reachable.
      #
      # 10g is derived from THIS droplet and is not transferable. The two bounds it sits
      # between, both measured rather than modelled:
      #
      #   floor   a healthy worker must not reach it. Observed at 1.6 GiB anon with 3
      #           concurrent sessions -- so a cap has to be well above that. Staging's 2g
      #           sits BELOW this floor, which is why copying that number here would
      #           OOM-kill the worker on the deploy that applied it.
      #   ceiling it has to trip before the host does. #449's thrash set in with the worker
      #           at 11.6 GB; 10g stops short of that, and leaves 5.6 GiB against the
      #           0.9 GiB everything else on the box actually uses.
      #
      # Raising it toward 12g would trade that margin for a slightly later kill, and the
      # margin is what keeps SSH answering -- which is the property being bought here.
      #
      # What is deliberately NOT claimed: that 10g is above the worker's true peak demand.
      # The per-session figure behind the floor was taken at 3 concurrent sessions, and
      # #449 -- whose growth mechanism is still unknown -- was observed at 10-13. Nothing
      # here establishes that the cost per session stays linear in between, so a heavy
      # enough load may well reach 10g. That is accepted rather than solved: at that same
      # load, uncapped, #449 already ends in a dead worker roughly 20 minutes in. The cap
      # does not add a failure, it relocates one -- out of the host and into this cgroup,
      # before the box has spent minutes thrashing on the way there.
      #
      # So this does NOT fix #449; it bounds its blast radius. Until that leak is
      # understood, sustained heavy load still ends in a worker restart that interrupts the
      # sessions on it. What changes is that the rest of the droplet stays up.
      #
      # One NARROW thing above is now solved rather than accepted. #815 caught a session's
      # own `bash` at 6.5 GiB of anonymous RSS against this cap, so
      # ZIMMER_SESSION_MEMORY_MAX_MB (below) gives each session its own cgroup and its own
      # bound underneath this one. That stops ONE RUNAWAY session from being the reason
      # this cap is reached.
      #
      # Read the word "underneath" literally, because the obvious misreading of it has
      # already been used to argue for more concurrency. cgroup v2 is HIERARCHICAL: the
      # per-session cgroups live at /sys/fs/cgroup/zimmer.sessions/session-<id>, which is
      # inside this container's cgroup, so every byte a session charges is charged to this
      # 10g as well. The per-session bound does NOT move session memory out of this budget
      # and does NOT create headroom -- six sessions at 4 GiB is 24 GiB against 10g, which
      # is why it is a runaway bound and not an admission-control budget.
      #
      # What is still wide open is N in-budget sessions summing over this cap, which is
      # #981: on 2026-09-05 eight of them did, with no runaway and the largest process at
      # 943 MB, and the kernel OOM-killed the GoodJob worker itself. `zimmer.sessions` has
      # no memory.max of its own, so a pile-up walks straight to this ceiling and the
      # worker is in the victim pool. Until #981 lands, this cap is the only thing between
      # a busy `agents` lane and a dead worker -- see config/connection_budget.rb, where
      # GOOD_JOB_AGENTS_THREADS is held at 8 for exactly this reason.
      memory: 10g
      volume:
        - zimmer_data:/home/rails/.zimmer
        - claude_home:/home/rails/.claude
        - codex_home:/home/rails/.codex
        - pi_home:/home/rails/.pi/agent
        - gh_config:/home/rails/.config/gh
        - claude_local:/home/rails/.local
        # Same catalog + credentials as web, so agent sessions (which run in the
        # worker) resolve the real production roots/MCP servers and their mcp_secrets.
        - /opt/zimmer/catalog:/rails/catalog:ro
        - /opt/zimmer/credentials:/rails/config/credentials:ro

ssh:
  user: root

env:
  clear:
    RAILS_ENV: production
    # Armed only when the worker is running under sysbox (see the role's options
    # above). The entrypoint reads it to decide whether to start an inner dockerd,
    # and refuses if the container turns out not to be user-namespaced.
    ZIMMER_NESTED_DOCKER: "<%= ENV.fetch("ZIMMER_NESTED_DOCKER", "0") %>"
    # Per-session memory bound, in MB (SessionMemoryCgroup). Each agent session gets its
    # own cgroup with this memory.max, so a runaway command exhausts its own budget and
    # the kernel's kill lands inside the session that caused it -- rather than inside the
    # 10g cap this role shares with the Rails worker, the inner dockerd and every other
    # session (#815).
    #
    # 4096 does NOT sum to the container cap and is not meant to: six sessions at 4 GiB is
    # 24 GiB against 10g. It bounds ONE runaway, which is the failure that has actually
    # happened; an admission-control budget would have to sit near 1.5 GiB and would start
    # killing sessions that work today. It sits roughly an order of magnitude above the
    # measured per-session cost (1.6 GiB anon TOTAL at 3 concurrent sessions, worker
    # included) and well under the 6.5 GiB runaway it exists to catch. `memory.peak` is now
    # recorded per session, so the number can be tightened on evidence.
    #
    # Set it here rather than on the box: 0 disables the bound entirely, which is the
    # break-glass an incident might need, and it ships as a deploy like everything else.
    ZIMMER_SESSION_MEMORY_MAX_MB: "<%= ENV.fetch("ZIMMER_SESSION_MEMORY_MAX_MB", "4096") %>"
    APP_HOST: zimmer.tadasant.com
    # Read the catalog from the mounted production catalog (delivered by
    # artifacts-sync-prod). production.rb falls back to the in-image catalog when this
    # file is not present yet (fresh box, before the first sync).
    AIR_CONFIG: /rails/catalog/air.production.json
    # Point the injected self-session MCP server at THIS instance. Both names carry
    # the same value through the AGENT_ORCHESTRATOR_* -> ZIMMER_* rename; the reader
    # (SelfSessionInjector#self_target) now reads the ZIMMER_ name.
    AGENT_ORCHESTRATOR_PROD_BASE_URL: https://zimmer.tadasant.com
    ZIMMER_PROD_BASE_URL: https://zimmer.tadasant.com
    # Managed Postgres (off-droplet), reached over the private VPC. Host/port are
    # injected from `terraform output`; TLS is mandatory for Managed Postgres.
    DATABASE_HOST: <%= ENV["PRODUCTION_DB_HOST"] %>
    DATABASE_PORT: <%= ENV.fetch("PRODUCTION_DB_PORT", "25060") %>
    DATABASE_USERNAME: doadmin
    DATABASE_SSLMODE: require
    REDIS_URL: redis://zimmer-redis:6379
    # The Google Parameter Store the ${VAR} resolution chain reads FIRST. These two
    # are the store's ADDRESS, not a credential -- only the service-account key below
    # is secret -- and they are deliberately in the clear so a misconfiguration is
    # diagnosable: the Connectors page can name the project it failed to reach, and
    # `kamal app exec 'env | grep ZIMMER_PARAMS_PROJECT_ID'` answers "is it even set?"
    # without touching a secret. Absent, the chain is just credentials -> ENV.
    ZIMMER_PARAMS_PROJECT_ID: zimmer-secrets-prod
    ZIMMER_PARAMS_LOCATION: global
  secret:
    - SECRET_KEY_BASE
    - RAILS_MASTER_KEY
    - API_KEYS
    - DATABASE_PASSWORD
    # The injected prod self-session MCP server calls this instance's own REST API.
    # Both names, one value, for the in-flight ZIMMER_* rename; the reader uses the
    # ZIMMER_ name now, and prod's encrypted mcp_secrets carries it too.
    - AGENT_ORCHESTRATOR_PROD_API_KEY
    - ZIMMER_PROD_API_KEY
    # Base64 of the operator SSH private key. OperatorSshKeyProvisioner decodes it into
    # ~/.ssh/zimmer_operator_ed25519 so agent sessions (and the ssh-* MCP servers they
    # attach) have an SSH identity; without it they have none. See .kamal/secrets.production.
    - ZIMMER_OPERATOR_SSH_KEY
    # Base64 of the Parameter Store resolver's service-account key JSON -- base64 for
    # the same env-file reason as the SSH key above, spelled out in
    # .kamal/secrets.production. Its two non-secret companions are in env.clear.
    - ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON
    # Base64 of the SEPARATE writer service-account key, for the one surface that
    # writes to the store (the Inference page's Pi tab). Optional: unset means
    # that tab reports the write path closed. See .kamal/secrets.production.
    - ZIMMER_PARAMS_WRITER_SERVICE_ACCOUNT_KEY_JSON
    - SENTRY_DSN_BACKEND
    - OTEL_LOGS_EXPORTER_ENDPOINT
    - OTEL_LOGS_EXPORTER_BEARER_TOKEN

# Production runs Redis and a scratch dev Postgres on the droplet. The database
# that holds real data is the off-droplet Managed cluster (a Terraform data source,
# never managed here), so there is no `db` accessory -- it survives the droplet
# being rebuilt.
accessories:
  redis:
    image: redis:7
    host: <%= ENV["PRODUCTION_HOST"] %>
    cmd: redis-server --appendonly yes
    volumes:
      - zimmer_redisdata:/data
  # The Postgres agent sessions boot `bin/agent-dev` against. It exists because a
  # session cannot make itself one: it runs as uid 1000 inside the worker container
  # with no root and no sudo, and the image ships no Postgres binaries. Without this
  # accessory there is no Postgres anywhere a session can reach, and "boot the app to
  # check the change" is impossible -- which is exactly the state that produced
  # "there is no Postgres, Docker or root in this clone".
  #
  # It holds nothing durable and nothing real. Every database in it is a scratch
  # `zimmer_dev_<clone>` that bin/agent-dev creates from schema.rb, and it is
  # deliberately volume-less so a restart wipes it rather than growing without
  # bound as clones come and go. Never point the app's real DATABASE_HOST here.
  #
  # The credentials are in the clear on purpose: this listens only on the private
  # Docker bridge, holds no data worth protecting, and every agent session needs
  # them. A secret would have to be handed to those sessions anyway, and pretending
  # otherwise would just make a broken boot harder to diagnose.
  devdb:
    image: postgres:16
    host: <%= ENV["PRODUCTION_HOST"] %>
    env:
      clear:
        POSTGRES_USER: zimmerdev
        POSTGRES_PASSWORD: zimmerdev
        POSTGRES_DB: postgres

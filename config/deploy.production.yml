# Kamal production destination. Merged over config/deploy.yml.
# Secrets are read from .kamal/secrets.production.
#
# Production deploys are orchestrated from a private companion repo (which
# holds the prod Terraform state, tfvars, and secrets); this file is public-safe
# because every environment-specific value comes in through ENV at deploy time.
#
# PRODUCTION_HOST is the droplet's tailnet address (resolved by the deploy workflow
# from `tailscale status`). PRODUCTION_DB_HOST/PORT are the Managed Postgres private
# host/port, fed from `terraform output`.
#
# Nested Docker is OFF by default here (staging is where the arrangement gets proven
# first). Resolved once and read by all three settings that depend on it -- the
# worker's runtime, its user, and the env var the entrypoint reads. They are only
# safe together, so they must never be able to disagree, and a default expressed
# three times is a default that eventually drifts twice. `ZIMMER_NESTED_DOCKER=1` in
# the deploy environment arms all three; anything else leaves all three disarmed,
# which is the rollback posture.
<% nested_docker = ENV.fetch("ZIMMER_NESTED_DOCKER", "0") == "1" %>

# The PRODUCTION catalog + its encrypted credentials, delivered to the host by
# artifacts-sync-prod and bind-mounted read-only into BOTH roles. Persistent host
# paths, so they survive Kamal deploys (unlike the old docker-cp-into-the-container
# mechanism, which every deploy wiped). AIR_CONFIG (below) points the app at the
# mounted catalog.
#
# Kamal's top-level `volumes:` is appended to every app role's `docker run`, so this
# is written once and lands on both. It is deliberately NOT a `servers.<role>.options
# .volume` entry: that key is an ARRAY, and Kamal's destination merge REPLACES arrays
# rather than appending to them -- restating it here would override the durable
# volume list in config/deploy.yml, and the next entry added there would silently
# reach staging only.
#
# The third entry is the `pty_transport` extension, whose code deliberately does not
# live in this repository -- it depends on internal-only techniques we do not publish,
# so it is delivered to the host by artifacts-sync-prod and mounted over the directory
# Zeitwerk would have loaded it from. ExtensionRegistry names the class
# (BUILTIN_EXTENSION_CLASSES) and resolves it with safe_constantize, so this mount is
# the only difference between a container that has the extension and one that does not.
#
# Three properties of that line are load-bearing:
#
#   * It mounts the extension's OWN subdirectory, never /rails/app/extensions. Mounting
#     the parent would shadow the in-image app/extensions/CLAUDE.md and
#     app/extensions/image_canary/ -- and the canary is precisely what
#     scripts/assert-extensions-shipped.sh exists to find.
#   * Read-only, on a persistent host path, so it survives `kamal deploy`. The deleted
#     scripts/install-extension.sh wrote into the container's writable layer instead,
#     and every deploy threw the result away.
#   * A missing or empty host directory is INERT, which is why this is safe to carry
#     before anything populates it: Docker creates the path, Zeitwerk's collapse of
#     app/extensions/* finds no files, safe_constantize returns nil, the registry skips
#     the name, and headless inference stays on native `claude -p`.
#
# Production eager-loads, so the files have to be there at container boot -- which is why
# populating the host directory is picked up by a health-gated Kamal cutover rather than
# by restarting a running container.
volumes:
  - /opt/zimmer/catalog:/rails/catalog:ro
  - /opt/zimmer/credentials:/rails/config/credentials:ro
  - /opt/zimmer/extensions/pty_transport:/rails/app/extensions/pty_transport:ro

# init: true, the durable volume list, and the worker's cmd/proxy live in
# config/deploy.yml -- they are identical in both destinations, and a list written
# once is a list that cannot drift. Only what genuinely differs is below.
servers:
  web:
    hosts:
      - <%= ENV["PRODUCTION_HOST"] %>
  worker:
    hosts:
      - <%= ENV["PRODUCTION_HOST"] %>
    options:
      # Nested Docker, off by default. ZIMMER_NESTED_DOCKER=1 at deploy time runs this
      # role under sysbox, which gives the container its own user namespace, and starts
      # it as (namespaced) root so the entrypoint can bring up an inner dockerd before
      # dropping back to uid 1000. Unset, both values are exactly what Docker would do
      # anyway, so a host without sysbox installed deploys unchanged.
      #
      # The switch is deliberately one variable rather than three: a host with the
      # runtime but not the user, or the user but not the env, fails in ways that look
      # like an app bug. See docs/operate/nested-docker.md.
      runtime: <%= nested_docker ? "sysbox-runc" : "runc" %>
      # Quoted: YAML reads a bare 0:0 as a sexagesimal integer and hands Kamal `0`,
      # which is uid 0 with the image's default gid -- close enough to look right and
      # wrong in a way nothing would report.
      user: "<%= nested_docker ? "0:0" : "1000:1000" %>"
      # The droplet is 16 GB with no swap, and this role is the only one that runs
      # arbitrary work: agent sessions, and jobs whose peak allocation is a function of
      # the data they touch rather than of anything this config knows. Uncapped, an
      # overshoot is a GLOBAL out-of-memory event -- the kernel takes victims across every
      # cgroup, so sshd and Caddy lose their working set and the droplet stops answering
      # SSH and HTTPS. It looks exactly like a dead box, and it is not.
      #
      # That is not hypothetical here. #449 measured this worker on 2026-08-14 climbing
      # from ~700 MB at rest to 11.6 GB RSS in ~18 minutes under 10-13 concurrent sessions,
      # which took the host to 139 MB available with 40% iowait and load 13.57 on 8 vCPU.
      # For minutes the whole box thrashed: single-row SELECTs took 31s, the queue backed
      # up until it paged, and every agent session slowed down. Then the process died
      # anyway, around 20 minutes in, taking every session's child process with it.
      #
      # So the choice is not "restart or no restart" -- #449 restarts it either way. It is
      # whether the restart is preceded by minutes of host-wide thrash. The cap buys the
      # second: the kill lands in this cgroup, at a moment of this config's choosing,
      # before the host has degraded at all. Everything else on the droplet -- web, redis,
      # devdb, kamal-proxy, and above all sshd -- keeps its memory and stays reachable.
      #
      # 10g is derived from THIS droplet and is not transferable. The two bounds it sits
      # between, both measured rather than modelled:
      #
      #   floor   a healthy worker must not reach it. Observed at 1.6 GiB anon with 3
      #           concurrent sessions -- so a cap has to be well above that. Staging's 2g
      #           sits BELOW this floor, which is why copying that number here would
      #           OOM-kill the worker on the deploy that applied it.
      #   ceiling it has to trip before the host does. #449's thrash set in with the worker
      #           at 11.6 GB; 10g stops short of that, and leaves 5.6 GiB against the
      #           0.9 GiB everything else on the box actually uses.
      #
      # Raising it toward 12g would trade that margin for a slightly later kill, and the
      # margin is what keeps SSH answering -- which is the property being bought here.
      #
      # What is deliberately NOT claimed: that 10g is above the worker's true peak demand.
      # The per-session figure behind the floor was taken at 3 concurrent sessions, and
      # #449 -- whose growth mechanism is still unknown -- was observed at 10-13. Nothing
      # here establishes that the cost per session stays linear in between, so a heavy
      # enough load may well reach 10g. That is accepted rather than solved: at that same
      # load, uncapped, #449 already ends in a dead worker roughly 20 minutes in. The cap
      # does not add a failure, it relocates one -- out of the host and into this cgroup,
      # before the box has spent minutes thrashing on the way there.
      #
      # So this does NOT fix #449; it bounds its blast radius. Until that leak is
      # understood, sustained heavy load still ends in a worker restart that interrupts the
      # sessions on it. What changes is that the rest of the droplet stays up.
      #
      # One NARROW thing above is solved rather than accepted. #815 caught a session's
      # own `bash` at 6.5 GiB of anonymous RSS against this cap, so
      # ZIMMER_SESSION_MEMORY_MAX_MB (below) gives each session its own cgroup and its own
      # bound underneath this one. That stops ONE RUNAWAY session from being the reason
      # this cap is reached.
      #
      # Read the word "underneath" literally, because the obvious misreading of it has
      # already been used to argue for more concurrency. cgroup v2 is HIERARCHICAL: the
      # per-session cgroups live at /sys/fs/cgroup/zimmer.sessions/sessions/session-<id>,
      # which is inside this container's cgroup, so every byte a session charges is charged
      # to this 10g as well. The per-session bound does NOT move session memory out of this
      # budget and does NOT create headroom -- six sessions at 4 GiB is 24 GiB against 10g,
      # which is why it is a runaway bound and not an admission-control budget.
      #
      # N in-budget sessions summing over this cap is #981: on 2026-09-05 eight of them did,
      # with no runaway and the largest process at 943 MB, and the kernel OOM-killed the
      # GoodJob worker itself. The `sessions` pool below (ZIMMER_SESSIONS_MEMORY_MAX_MB) is
      # the answer to WHERE that kill lands -- it holds every session cgroup and not the
      # worker, so the OOM is now declared in a cgroup the worker is outside of. Carved out
      # of this 10g, not added to it.
      #
      # Which is worth stating the right way round, because this cap does not protect the
      # worker from a pile-up -- the pool does, and only by choosing a different victim.
      # What THIS cap protects is the DROPLET. Nothing above reduces the demand, so the
      # only thing limiting how often the pool is exhausted is the `agents` lane's own
      # width: GOOD_JOB_AGENTS_THREADS (12) is the admission control.
      #
      # It is also the ONLY bound on the one path the pool does not cover. The inner
      # dockerd starts before the cgroup delegation, so it and the `.agent-containers` dev
      # stacks it runs are charged to THIS cgroup rather than to the pool -- alongside the
      # worker, in the victim set this cap selects from. See
      # config/connection_budget.rb for the measurements and
      # docs/operate/nested-docker.md for the dev-stack accounting.
      memory: 10g

ssh:
  user: root

env:
  clear:
    RAILS_ENV: production
    # Armed only when the worker is running under sysbox (see the role's options
    # above). The entrypoint reads it to decide whether to start an inner dockerd,
    # and refuses if the container turns out not to be user-namespaced.
    ZIMMER_NESTED_DOCKER: "<%= nested_docker ? "1" : "0" %>"
    # Per-session memory bound, in MB (SessionMemoryCgroup). Each agent session gets its
    # own cgroup with this memory.max, so a runaway command exhausts its own budget and
    # the kernel's kill lands inside the session that caused it -- rather than inside the
    # 10g cap this role shares with the Rails worker, the inner dockerd and every other
    # session (#815).
    #
    # 4096 does NOT sum to the container cap and is not meant to: six sessions at 4 GiB is
    # 24 GiB against 10g. It bounds ONE runaway, which is the failure that has actually
    # happened; an admission-control budget would have to sit near 1.5 GiB and would start
    # killing sessions that work today. It sits roughly an order of magnitude above the
    # measured per-session cost (1.6 GiB anon TOTAL at 3 concurrent sessions, worker
    # included) and well under the 6.5 GiB runaway it exists to catch. `memory.peak` is now
    # recorded per session, so the number can be tightened on evidence.
    #
    # Set it here rather than on the box: 0 disables the bound entirely, which is the
    # break-glass an incident might need, and it ships as a deploy like everything else.
    ZIMMER_SESSION_MEMORY_MAX_MB: "<%= ENV.fetch("ZIMMER_SESSION_MEMORY_MAX_MB", "4096") %>"
    # The AGGREGATE bound over every session at once, in MB, on the `zimmer.sessions/sessions`
    # pool cgroup that bin/docker-entrypoint creates. Per-session bounds do not sum to
    # anything, and on 2026-09-05 that was the failure: eight sessions each far inside their
    # 4 GiB reached 8.7 GB between them, the 10g cap above fired, and the kernel picked the
    # biggest process in the cgroup -- `bundle exec good_job start`, the Rails worker running
    # every session on the box. It died and took every in-flight session with it
    # (tadasant/zimmer#981).
    #
    # 6144 is what is left of the 10g (10240 MB) cap once the residual is big enough to
    # hold the two things that must survive a pile-up, both of which live OUTSIDE this pool:
    # the Rails worker in the `app` sibling (943 MB anon at the kill, ~1.6 GiB measured with
    # three sessions) and the inner dockerd with the dev stacks it runs (dockerd starts
    # before the delegation block, so it and its containers stay in the container cgroup;
    # ~1.5 GiB of node and postgres in the same task dump). That is ~3.1 GiB, so the
    # residual has to be comfortably above it -- 4096 MB, not the ~3 GiB that a 7168 pool
    # would leave.
    #
    # The margin is the whole point rather than caution. A pool sized so that sessions can
    # sit just under it while the CONTAINER cap fires anyway is decorative: the container
    # OOM selects across the whole container and takes the worker, which is #981 recurring
    # with the new mechanism working exactly as designed. The pool has to fire FIRST.
    #
    # What this does NOT claim is that sessions never want more than 6 GiB. Under the load
    # that produced #981 they wanted ~9, so the pool would have OOM-killed a session. That is
    # the point: a session dies with an attributable cause and a recovery prompt, instead of
    # the worker dying and taking all of them. ZIMMER_SESSION_PARALLEL_WORKERS below is the
    # half that reduces the demand rather than choosing the victim.
    #
    # DO NOT RAISE THIS TO MATCH GOOD_JOB_AGENTS_THREADS. That is the intuitive move and it
    # is backwards. At 7168 the residual drops to 3072 MB, under the ~3.1 GiB the two
    # outside-pool tenants are measured at, so the CONTAINER cap fires first -- and it
    # selects across the whole container, taking the worker. That is #981 again, with this
    # mechanism working exactly as designed. This number is sized from what must SURVIVE a
    # pile-up, never from how many sessions are admitted into one.
    #
    # More sessions in a hard-capped pool cannot push the worker out of memory through the
    # pool: the pool fires first and the extra pressure is spent inside it. What it costs is
    # headroom for concurrent heavy work. Measured on the live worker at 12 session cgroups:
    # pool `anon` 3154 MB of the 6144 cap, ~263 MB per session, leaving ~3.0 GB -- roughly
    # five concurrent capped suites at ~560 MB each. The conservative figure from #981's
    # peak task dump (~382 MB per session) leaves ~1.5 GB, or two to three. The real
    # tolerance is somewhere in that band and is not pinned down; past it the pool OOM-kills
    # ONE session with an attributable cause and a retry, which is the designed degradation
    # rather than a fault.
    #
    # The dev stacks are the exception and they are NOT in this pool -- see the `memory:`
    # comment above. Nothing here bounds them.
    #
    # 0 means no aggregate cap, with per-session bounds left in force -- the break-glass.
    ZIMMER_SESSIONS_MEMORY_MAX_MB: "<%= ENV.fetch("ZIMMER_SESSIONS_MEMORY_MAX_MB", "6144") %>"
    # PARALLEL_WORKERS for every agent session, capping the test workers a session's Rails
    # suite forks. 41 `ruby` processes at 215-350 MB apiece were 8.7 of the 9.5 GB anon at
    # #981's kill: each session sizes `parallelize(workers: :number_of_processors)` off the
    # droplet's 8 vCPU as though it had the box to itself, and eight of them multiply. A
    # mitigation, not a bound -- the pool above is the bound. 0 turns it off.
    ZIMMER_SESSION_PARALLEL_WORKERS: "<%= ENV.fetch("ZIMMER_SESSION_PARALLEL_WORKERS", "2") %>"
    # Which of Zimmer's `mcp_secrets` reach a session clone's `.env`. Unset (the
    # default) means SCOPED: a session gets the secrets its own MCP servers, skills
    # and hooks declare, and nothing else -- see SessionSecretScope. Before
    # tadasant/zimmer#372 every clone got all ~90, so a session provisioned with
    # nothing but `grafana` could still read SLACK_BOT_TOKEN, the Cloudflare
    # read-write pair and three GCS service-account keys.
    #
    # "all" is the break-glass: every clone gets the whole bundle again, fleet-wide,
    # as one deploy-time variable. Reach for it if a narrowing turns out to have taken
    # a credential something genuinely needed and you need every session working again
    # in one deploy. The narrower fixes, in order of preference: attach the MCP server
    # that declares the variable to the affected session (which rewrites its `.env` on
    # the next turn), or name the variable in ZIMMER_SESSION_ENV_EXTRA_KEYS below.
    ZIMMER_SESSION_ENV_SCOPE: "<%= ENV.fetch("ZIMMER_SESSION_ENV_SCOPE", "scoped") %>"
    # Comma-separated secret names every clone gets regardless of what its artifacts
    # declare. Empty by default -- nothing in the bundle is needed by a clone for a
    # reason no artifact states. This is the surgical half of the break-glass above.
    ZIMMER_SESSION_ENV_EXTRA_KEYS: "<%= ENV.fetch("ZIMMER_SESSION_ENV_EXTRA_KEYS", "") %>"
    APP_HOST: zimmer.tadasant.com
    # Read the catalog from the mounted production catalog (delivered by
    # artifacts-sync-prod). production.rb falls back to the in-image catalog when this
    # file is not present yet (fresh box, before the first sync).
    AIR_CONFIG: /rails/catalog/air.production.json
    # Point the injected self-session MCP server at THIS instance, never at some
    # other orchestrator whose host might be carried in through ported credentials.
    ZIMMER_PROD_BASE_URL: https://zimmer.tadasant.com
    # Managed Postgres (off-droplet), reached over the private VPC. Host/port are
    # injected from `terraform output`; TLS is mandatory for Managed Postgres.
    DATABASE_HOST: <%= ENV["PRODUCTION_DB_HOST"] %>
    DATABASE_PORT: <%= ENV.fetch("PRODUCTION_DB_PORT", "25060") %>
    DATABASE_USERNAME: doadmin
    DATABASE_SSLMODE: require
    REDIS_URL: redis://zimmer-redis:6379
    # The Google Parameter Store the ${VAR} resolution chain reads FIRST. These two
    # are the store's ADDRESS, not a credential -- only the service-account key below
    # is secret -- and they are deliberately in the clear so a misconfiguration is
    # diagnosable: the Connectors page can name the project it failed to reach, and
    # `kamal app exec 'env | grep ZIMMER_PARAMS_PROJECT_ID'` answers "is it even set?"
    # without touching a secret. Absent, the chain is just credentials -> ENV.
    ZIMMER_PARAMS_PROJECT_ID: zimmer-secrets-prod
    ZIMMER_PARAMS_LOCATION: global
  secret:
    - SECRET_KEY_BASE
    - RAILS_MASTER_KEY
    - API_KEYS
    - DATABASE_PASSWORD
    # The injected prod self-session MCP server calls this instance's own REST API.
    # SelfSessionInjector reads this name; prod's encrypted mcp_secrets carries it too.
    - ZIMMER_PROD_API_KEY
    # Base64 of the operator SSH private key. OperatorSshKeyProvisioner decodes it into
    # ~/.ssh/zimmer_operator_ed25519 so agent sessions (and the ssh-* MCP servers they
    # attach) have an SSH identity; without it they have none. See .kamal/secrets.production.
    - ZIMMER_OPERATOR_SSH_KEY
    # Base64 of the Parameter Store resolver's service-account key JSON -- base64 for
    # the same env-file reason as the SSH key above, spelled out in
    # .kamal/secrets.production. Its two non-secret companions are in env.clear.
    - ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON
    # Base64 of the SEPARATE writer service-account key, for the one surface that
    # writes to the store (the Inference page's Pi tab). Optional: unset means
    # that tab reports the write path closed. See .kamal/secrets.production.
    - ZIMMER_PARAMS_WRITER_SERVICE_ACCOUNT_KEY_JSON
    - SENTRY_DSN_BACKEND
    - OTEL_LOGS_EXPORTER_ENDPOINT
    - OTEL_LOGS_EXPORTER_BEARER_TOKEN

# Production runs Redis and a scratch dev Postgres on the droplet. The database
# that holds real data is the off-droplet Managed cluster (a Terraform data source,
# never managed here), so there is no `db` accessory -- it survives the droplet
# being rebuilt.
accessories:
  redis:
    image: redis:7
    host: <%= ENV["PRODUCTION_HOST"] %>
    cmd: redis-server --appendonly yes
    volumes:
      - zimmer_redisdata:/data
  # The Postgres agent sessions boot `bin/agent-dev` against. It exists because a
  # session cannot make itself one: it runs as uid 1000 inside the worker container
  # with no root and no sudo, and the image ships no Postgres binaries. Without this
  # accessory there is no Postgres anywhere a session can reach, and "boot the app to
  # check the change" is impossible -- which is exactly the state that produced
  # "there is no Postgres, Docker or root in this clone".
  #
  # It holds nothing durable and nothing real. Every database in it is a scratch
  # `zimmer_dev_<clone>` that bin/agent-dev creates from schema.rb, and it is
  # deliberately volume-less so a restart wipes it rather than growing without
  # bound as clones come and go. Never point the app's real DATABASE_HOST here.
  #
  # The credentials are in the clear on purpose: this listens only on the private
  # Docker bridge, holds no data worth protecting, and every agent session needs
  # them. A secret would have to be handed to those sessions anyway, and pretending
  # otherwise would just make a broken boot harder to diagnose.
  devdb:
    image: postgres:16
    host: <%= ENV["PRODUCTION_HOST"] %>
    env:
      clear:
        POSTGRES_USER: zimmerdev
        POSTGRES_PASSWORD: zimmerdev
        POSTGRES_DB: postgres

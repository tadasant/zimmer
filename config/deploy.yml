# Kamal 2 base config for Zimmer — shared across destinations (staging, prod).
#
# Destination-specific overrides live in config/deploy.<dest>.yml; secrets in
# .kamal/secrets.<dest>. Deploy with:  bin/kamal deploy -d staging
#
# Zimmer images are built + pushed by CI (release-image.yml / deploy-staging.yml),
# so Kamal deploys a PREBUILT tag with `--skip-push` rather than building here. The
# builder block below only exists so `kamal` can parse the config; no build runs in
# the normal path.
#
# The host is a PERSISTENT droplet (Terraform provisions it once with
# `ignore_changes = [user_data]`); Kamal owns everything above the host and swaps
# containers with zero downtime via kamal-proxy. This replaces the old model where
# every app change re-rendered cloud-init and force-replaced the droplet.
service: zimmer
# Repository path only -- Kamal prepends registry.server, so this resolves to
# ghcr.io/tadasant/zimmer. Including the registry here would double it.
image: tadasant/zimmer

# Force `-d <dest>` on every command so a bare `kamal deploy` can't hit the wrong
# environment.
require_destination: true

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# kamal-proxy owns :80 on the host and does health-gated zero-downtime cutover:
# the new container must answer /up before traffic switches, and a failed deploy
# leaves the old container serving. When a custom domain is enabled, a host Caddy
# terminates TLS in front of kamal-proxy (as in agent-orchestrator); staging's
# first cut is plain HTTP over the tailnet, so ssl is off here.
proxy:
  ssl: false
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5
  # kamal-proxy publishes 80 AND 443 on the host by default -- even with ssl: false.
  # Caddy already owns those (it terminates TLS for the custom domain), so the two
  # collide: "failed to bind host port 0.0.0.0:443/tcp: address already in use".
  # Move kamal-proxy to 8080/8443 and let Caddy front it, which is the same topology
  # agent-orchestrator uses.
  run:
    http_port: 8080
    https_port: 8443

# The image entrypoint runs `bin/rails db:prepare` and then boots Thruster+Puma,
# which can exceed Kamal's 30s default on a cold start.
deploy_timeout: 120

builder:
  arch: amd64
  driver: docker

# Both destinations run the same two roles off the same image, with the same PID 1
# and the same durable mounts. Only the host list, the memory cap, the nested-Docker
# switch and the env blocks genuinely differ, so those stay in
# config/deploy.<dest>.yml and everything else is here, once.
#
# Kamal merges the destination file over this one with ActiveSupport's `deep_merge!`
# (kamal/configuration.rb#load_config_files), which recurses into HASHES and REPLACES
# ARRAYS. A destination that redeclares `volume:` therefore overrides this list rather
# than adding to it -- so a destination needing an extra mount adds it through the
# top-level `volumes:` key, which Kamal appends to every app role's `docker run`
# (production does exactly that for /opt/zimmer). That is the property that makes a
# new entry below reach BOTH destinations instead of only the one it was added to.
servers:
  web:
    options:
      # tini-style PID 1 so agent-spawned grandchildren (gh, git, node, chrome,
      # claude) are reaped instead of piling up as zombies.
      init: true
      # Durable named volumes shared by web + worker so both see the same clones,
      # runtime credentials, and gh auth. They survive Kamal container swaps (the
      # whole point of a persistent host) -- state is no longer lost on every deploy.
      #
      # Every runtime home is here: ~/.claude for Claude Code, CODEX_HOME (~/.codex)
      # for Codex rollouts, auth.json, and the thread store. A runtime home left on
      # the container layer is destroyed by each deploy, and the next `resume` then
      # fails with "no rollout found" and restarts the conversation from zero -- which
      # is what 678f768 had to fix for Codex.
      #
      # Pi is the exception that still gets a mount: its TRANSCRIPT lives inside the
      # session's own clone (PiRuntimeAdapter passes --session-dir), so it is durable
      # via zimmer_data. PI_CODING_AGENT_DIR holds its credential and provider state
      # instead -- auth.json, models.json, settings.json -- which is milder to lose but
      # just as invisible, so it is mounted on the same terms.
      volume: &durable_volumes
        - zimmer_data:/home/rails/.zimmer
        - claude_home:/home/rails/.claude
        - codex_home:/home/rails/.codex
        - pi_home:/home/rails/.pi/agent
        - gh_config:/home/rails/.config/gh
        - claude_local:/home/rails/.local
  worker:
    # production.rb sets good_job.execution_mode = :external, so jobs only run if a
    # dedicated worker process is up. Same image, env and volumes as web; what differs
    # per destination is the memory cap and the nested-Docker runtime/user pair.
    cmd: bundle exec good_job start
    proxy: false
    options:
      init: true
      volume: *durable_volumes

env:
  clear:
    # RAILS_ENV is set PER DESTINATION (config/deploy.<dest>.yml), not here.
    # Staging must run RAILS_ENV=staging: SelfSessionInjector keys the injected
    # self-session MCP server off Rails.env, so a staging box running as
    # "production" injects the PRODUCTION server and dies on a missing
    # ZIMMER_PROD_API_KEY -- which is exactly what the pre-Kamal
    # cloud-init did, breaking every staging session.
    OTEL_SERVICE_NAME: zimmer
    # Accessories share the Kamal docker network; reach them by container name
    # (<service>-<accessory>).
    #
    # NO trailing /0: production.rb builds the cache store as "#{ENV['REDIS_URL']}/0",
    # so a URL that already ends in /0 becomes redis://…:6379/0/0.
    REDIS_URL: redis://zimmer-redis:6379
    # The commit identity every agent session gets, written into the container's
    # global git config at boot by GitIdentityProvisioner. Without it the first
    # `git commit` of every committing session exits 128 (#575).
    #
    # Deliberately NOT a value this repo carries: an identity is per-deployment, and
    # a default baked in here would put Zimmer's guess in a self-hoster's git history.
    # Both destinations read it from the deploy-time environment, which for production
    # is supplied by the private companion repo that orchestrates the deploy. Empty is
    # a supported state — the provisioner then writes nothing and says so at boot.
    #
    # In the clear because neither half is a secret: an author name and email are
    # published in every commit they sign.
    #
    # `.to_json`, and not the bare interpolation every other value here uses.
    # Kamal validates `env.clear` as a hash of strings, and an unset
    # variable renders to nothing — which YAML reads as `nil`, not `""`, so every
    # kamal command (deploy included) dies with "env/clear/ZIMMER_GIT_USER_NAME:
    # should be a string" on precisely the unconfigured deployment this is supposed
    # to degrade gracefully for. JSON-encoding emits `""` for that case, and quotes
    # a name containing a `"` rather than ending the scalar early.
    ZIMMER_GIT_USER_NAME: <%= ENV.fetch("ZIMMER_GIT_USER_NAME", "").to_json %>
    ZIMMER_GIT_USER_EMAIL: <%= ENV.fetch("ZIMMER_GIT_USER_EMAIL", "").to_json %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f

# Keep the last N images on the host so `kamal rollback <version>` is instant.
retain_containers: 5

minimum_version: 2.0.0

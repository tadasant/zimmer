# Kamal staging destination. Merged over config/deploy.yml.
# Secrets are read from .kamal/secrets.staging.
#
# STAGING_HOST is injected by the deploy workflow as the droplet's TAILNET address
# (GitHub runners get no MagicDNS, so the workflow resolves the IP from
# `tailscale status --json` and exports it). Both roles and both accessories run on
# the single staging droplet.
servers:
  web:
    hosts:
      - <%= ENV["STAGING_HOST"] %>
    options:
      # tini-style PID 1 so agent-spawned grandchildren (gh, git, node, chrome,
      # claude) are reaped instead of piling up as zombies.
      init: true
      # Durable named volumes shared by web + worker so both see the same clones,
      # runtime credentials, and gh auth. They survive Kamal container swaps (the
      # whole point of a persistent host) -- state is no longer lost on every deploy.
      # Both runtime homes are here: ~/.claude for Claude Code, CODEX_HOME
      # (~/.codex) for Codex rollouts, auth.json, and the thread store. A runtime
      # home left on the container layer is destroyed by each deploy, and the next
      # `resume` then fails with "no rollout found" and restarts from zero.
      volume:
        - zimmer_data:/home/rails/.zimmer
        - claude_home:/home/rails/.claude
        - codex_home:/home/rails/.codex
        - gh_config:/home/rails/.config/gh
        - claude_local:/home/rails/.local
  worker:
    hosts:
      - <%= ENV["STAGING_HOST"] %>
    # production.rb sets good_job.execution_mode = :external, so jobs only run if a
    # dedicated worker process is up. Same image/env/volumes as web.
    cmd: bundle exec good_job start
    proxy: false
    options:
      init: true
      # Nested Docker, off by default. ZIMMER_NESTED_DOCKER=1 at deploy time runs this
      # role under sysbox, which gives the container its own user namespace, and starts
      # it as (namespaced) root so the entrypoint can bring up an inner dockerd before
      # dropping back to uid 1000. Unset, both values are exactly what Docker would do
      # anyway, so a host without sysbox installed deploys unchanged.
      #
      # The switch is deliberately one variable rather than three: a host with the
      # runtime but not the user, or the user but not the env, fails in ways that look
      # like an app bug. See docs/operate/nested-docker.md.
      runtime: <%= ENV["ZIMMER_NESTED_DOCKER"] == "1" ? "sysbox-runc" : "runc" %>
      # Quoted: YAML reads a bare 0:0 as a sexagesimal integer and hands Kamal `0`,
      # which is uid 0 with the image's default gid -- close enough to look right and
      # wrong in a way nothing would report.
      user: "<%= ENV["ZIMMER_NESTED_DOCKER"] == "1" ? "0:0" : "1000:1000" %>"
      volume:
        - zimmer_data:/home/rails/.zimmer
        - claude_home:/home/rails/.claude
        - codex_home:/home/rails/.codex
        - gh_config:/home/rails/.config/gh
        - claude_local:/home/rails/.local

ssh:
  user: root

env:
  clear:
    # NOT "production". config/environments/staging.rb exists and is fully
    # production-shaped (eager_load, external GoodJob + cron, redis cache store),
    # and database.yml has a `staging:` section. Running staging as "production"
    # -- which the pre-Kamal cloud-init did -- makes SelfSessionInjector inject the
    # `agent-orchestrator-prod-self-session` MCP server, whose
    # ${AGENT_ORCHESTRATOR_PROD_API_KEY} lives only in production's encrypted
    # credentials. Every staging session then died in SecretsInterpolator before the
    # agent ever started.
    RAILS_ENV: staging
    # Armed only when the worker is running under sysbox (see the role's options
    # above). The entrypoint reads it to decide whether to start an inner dockerd,
    # and refuses if the container turns out not to be user-namespaced.
    ZIMMER_NESTED_DOCKER: "<%= ENV.fetch("ZIMMER_NESTED_DOCKER", "0") %>"
    # Canonical external host: the custom domain (Caddy terminates TLS on :443 in
    # front of kamal-proxy). Without this, McpOauthService falls back to
    # localhost:3000 and every OAuth callback breaks.
    APP_HOST: staging.zimmer.tadasant.com
    # Point the injected self-session MCP server at THIS instance, so a staging
    # session orchestrates staging -- never production, and never some other
    # instance whose host might get carried in through ported credentials, which
    # would point Zimmer's own sessions at someone else's box.
    # Both names carry the same value through the AGENT_ORCHESTRATOR_* -> ZIMMER_*
    # rename; see .kamal/secrets.staging.
    AGENT_ORCHESTRATOR_STAGING_BASE_URL: https://staging.zimmer.tadasant.com
    ZIMMER_STAGING_BASE_URL: https://staging.zimmer.tadasant.com
    DATABASE_HOST: zimmer-db
    DATABASE_PORT: "5432"
    DATABASE_USERNAME: zimmer
    # The throwaway Postgres accessory speaks no TLS.
    DATABASE_SSLMODE: prefer
    # The Google Parameter Store the ${VAR} resolution chain reads FIRST. Staging's
    # OWN project, never production's -- agent sessions have root on this box, and
    # zimmer-secrets-prod's resolver reads production secret VALUES. These two are the
    # store's ADDRESS, not a credential (only the service-account key below is secret),
    # and they are deliberately in the clear so a misconfiguration is diagnosable: the
    # Connectors page can name the project it failed to reach, and
    # `kamal app exec 'env | grep ZIMMER_PARAMS_PROJECT_ID'` answers "is it even set?"
    # without touching a secret. Absent, the chain is just credentials -> ENV.
    ZIMMER_PARAMS_PROJECT_ID: zimmer-secrets-staging
    ZIMMER_PARAMS_LOCATION: global
  secret:
    - SECRET_KEY_BASE
    # Decrypts the committed config/credentials/staging.yml.enc, so SecretsLoader
    # can serve mcp_secrets (SLACK_BOT_TOKEN, ENG_ALERTS_SLACK_CHANNEL_ID) to
    # SlackService, AlertService, and any MCP server with a ${VAR} placeholder.
    # Blank or unset simply leaves the credentials inert -- see .kamal/secrets.staging.
    - RAILS_MASTER_KEY
    - API_KEYS
    - DATABASE_PASSWORD
    # Base64 of the operator SSH private key. OperatorSshKeyProvisioner decodes it into
    # ~/.ssh/zimmer_operator_ed25519 so agent sessions (and the ssh-* MCP servers they
    # attach) have an SSH identity; without it they have none. See .kamal/secrets.staging.
    - ZIMMER_OPERATOR_SSH_KEY
    # Base64 of the Parameter Store resolver's service-account key JSON -- base64 for
    # the same env-file reason as the SSH key above, spelled out in .kamal/secrets.staging.
    # Its two non-secret companions are in env.clear. Unset is a designed state, not a
    # gap: the store link is absent and every ${VAR} comes from staging.yml.enc as before.
    - ZIMMER_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON
    # The API key the injected self-session MCP server uses to call this instance's
    # own REST API. It lives in process ENV rather than mcp_secrets (SecretsInterpolator
    # falls back to ENV), because the deploy workflow derives it from API_KEYS -- which
    # is the same list /mcp authenticates against, so it cannot drift out of sync.
    # Both names, one value, for the in-flight ZIMMER_* rename.
    - AGENT_ORCHESTRATOR_STAGING_API_KEY
    - ZIMMER_STAGING_API_KEY
    # Observability. The app's initializers are hard no-ops when these are empty,
    # so an unset secret simply disables shipping -- but they must be PRESENT here,
    # or staging silently loses Sentry + OTel the way the pre-Kamal TF vars did not.
    - SENTRY_DSN_BACKEND
    - OTEL_LOGS_EXPORTER_ENDPOINT
    - OTEL_LOGS_EXPORTER_BEARER_TOKEN

# Staging's data stores run as Kamal accessories on the same droplet (throwaway;
# they hold nothing durable). Production instead points DATABASE_HOST at the
# Terraform-managed Managed Postgres and ships no db accessory.
accessories:
  db:
    image: postgres:16
    host: <%= ENV["STAGING_HOST"] %>
    env:
      clear:
        POSTGRES_USER: zimmer
        # Only takes effect at FIRST initdb of the zimmer_pgdata volume. On an
        # already-initialized volume this is inert: the databases Rails actually
        # uses (zimmer_staging + zimmer_staging_cable, per database.yml) are created
        # by `db:prepare` in the app entrypoint, which can do so only because
        # POSTGRES_USER is the cluster superuser.
        POSTGRES_DB: zimmer_staging
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - zimmer_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    host: <%= ENV["STAGING_HOST"] %>
    volumes:
      - zimmer_redisdata:/data
  # The scratch Postgres agent sessions boot `bin/agent-dev` against -- the same
  # accessory production ships, with the same clear credentials, so the boot
  # procedure is identical in both environments. Deliberately NOT the `db`
  # accessory above: that one holds staging's own data and lives on a durable
  # volume, and a session running migrations from a feature branch has no business
  # in it. This one is volume-less and disposable. Full rationale in
  # config/deploy.production.yml.
  devdb:
    image: postgres:16
    host: <%= ENV["STAGING_HOST"] %>
    env:
      clear:
        POSTGRES_USER: zimmerdev
        POSTGRES_PASSWORD: zimmerdev
        POSTGRES_DB: postgres

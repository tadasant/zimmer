# Database Configuration
#
# This application uses PostgreSQL exclusively.
#
# PostgreSQL Configuration:
#   - Default port is 5432 (standard PostgreSQL port)
#   - macOS Postgres.app users: set DATABASE_PORT=5450 in your .env file
#   - Requires pg gem: gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # Derived, never a literal. Zimmer runs two roles (`web`, `worker`) against two
  # databases (`primary`, `cable`), and those four pools have four different right
  # answers -- a single flat number is correct for at most one of them and overcommits
  # the rest against a database with a hard connection ceiling. ConnectionBudget
  # (config/connection_budget.rb) derives each from Puma's threads and GoodJob's
  # scheduler threads, and states the server-side budget the whole deployment needs.
  # Read it before changing anything here.
  pool: <%= ConnectionBudget.primary_pool %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV['USER']) %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  # "require" means TLS or no connection. The strict value is the default on
  # purpose: "prefer" asks for TLS, accepts plaintext when the server does not
  # offer it, and says nothing either way -- so a deployment that loses TLS
  # (a rebuilt server with SSL off, a proxy in the path, a hostname pointed at
  # the wrong box) keeps working, unencrypted, with no error to notice. A
  # deployment that genuinely speaks no TLS opts down explicitly and visibly:
  # config/deploy.staging.yml sets DATABASE_SSLMODE=prefer for the throwaway
  # compose Postgres accessory, .agent-containers/.env.dev sets "disable", and
  # config/deploy.production.yml sets "require" for DigitalOcean Managed
  # Postgres. Dev and test override below -- see local_default.
  sslmode: <%= ENV.fetch("DATABASE_SSLMODE", "require") %>

# Development and test. Local Postgres -- the Homebrew/Postgres.app one, the
# GitHub Actions `postgres:` service container, the compose `db` -- ships with
# `ssl = off`, so "require" here would refuse to connect at all. These databases
# hold fixtures on loopback, not credentials over a network, so "prefer" is the
# honest default and DATABASE_SSLMODE still overrides it.
local_default: &local_default
  <<: *default
  sslmode: <%= ENV.fetch("DATABASE_SSLMODE", "prefer") %>

# DATABASE_NAME is the one env override development and test take that the
# deployed environments do not. Agent sessions all share a single dev Postgres
# accessory (bin/agent-dev), so each clone needs its own database names or two
# sessions booting at once migrate over each other -- and `db:prepare` in
# development creates the TEST databases too, so namespacing only the
# development pair would still collide on `zimmer_test`. Unset -- every laptop,
# and CI -- these are exactly the old literals.
#
# Postgres caps identifiers at 63 bytes and the longest suffix built here is
# `_test_cable` (11), so bin/agent-dev caps the value it sets at 52 -- which lands
# exactly on the limit, not under it.
development:
  primary:
    <<: *local_default
    database: <%= ENV["DATABASE_NAME"].to_s.empty? ? "zimmer_development" : ENV["DATABASE_NAME"] %>
  cable:
    <<: *local_default
    database: <%= ENV["DATABASE_NAME"].to_s.empty? ? "zimmer_development_cable" : "#{ENV["DATABASE_NAME"]}_cable" %>
    # Deliberately not the primary pool's size: solid_cable takes no advisory lock, so a
    # cable connection is leased per INSERT rather than held for a job. See ConnectionBudget.
    pool: <%= ConnectionBudget.cable_pool %>
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *local_default
    database: <%= ENV["DATABASE_NAME"].to_s.empty? ? "zimmer_test" : "#{ENV["DATABASE_NAME"]}_test" %>
  cable:
    <<: *local_default
    database: <%= ENV["DATABASE_NAME"].to_s.empty? ? "zimmer_test_cable" : "#{ENV["DATABASE_NAME"]}_test_cable" %>
    # Deliberately not the primary pool's size: solid_cable takes no advisory lock, so a
    # cable connection is leased per INSERT rather than held for a job. See ConnectionBudget.
    pool: <%= ConnectionBudget.cable_pool %>
    migrations_paths: db/cable_migrate

staging:
  primary:
    <<: *default
    database: zimmer_staging
  cable:
    <<: *default
    database: zimmer_staging_cable
    # Deliberately not the primary pool's size: solid_cable takes no advisory lock, so a
    # cable connection is leased per INSERT rather than held for a job. See ConnectionBudget.
    pool: <%= ConnectionBudget.cable_pool %>
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: zimmer_production
  cable:
    <<: *default
    database: zimmer_production_cable
    # Deliberately not the primary pool's size: solid_cable takes no advisory lock, so a
    # cable connection is leased per INSERT rather than held for a job. See ConnectionBudget.
    pool: <%= ConnectionBudget.cable_pool %>
    migrations_paths: db/cable_migrate

# Live Mode voice-engine list prices, in USD. Read by LiveVoicePricing, which
# prices every LiveUsageEvent as it is written and stamps the row with `version`.
#
# Bump `version` whenever a rate here changes: rows keep the version they were
# priced at, so a figure on /live/costs can always be traced to the table that
# produced it, and rows priced under an old table can be told apart (and
# re-priced from their stored volumes) rather than silently mixed.
#
# A model or vendor that is not listed prices at zero and the row is marked
# unpriced — a wrong rate is worse than a visibly missing one. /live/costs shows
# unpriced rows as their own count.
#
# Sources, checked 2026-11-14:
#   OpenAI   https://developers.openai.com/api/docs/pricing
#   Anthropic  the claude-api skill's model table (cached 2026-11-03)
version: "2026-11-14"

# Per 1M tokens. `cached_input` is what a cached prompt token costs.
openai_realtime:
  gpt-realtime-2.1-mini:
    audio: { input: 10.00, cached_input: 0.30, output: 20.00 }
    text: { input: 0.60, cached_input: 0.06, output: 2.40 }
  gpt-realtime-2.1:
    audio: { input: 32.00, cached_input: 0.40, output: 64.00 }
    text: { input: 4.00, cached_input: 0.40, output: 24.00 }
  gpt-realtime-2:
    audio: { input: 32.00, cached_input: 0.40, output: 64.00 }
    text: { input: 4.00, cached_input: 0.40, output: 24.00 }

# Per 1M tokens.
openai_transcription:
  gpt-4o-mini-transcribe: { input: 1.25, output: 5.00 }
  gpt-4o-transcribe: { input: 2.50, output: 10.00 }

# Per minute of session, billed per second.
openai_live:
  gpt-live-1: { per_minute: 0.05 }

# Per 1M tokens. `cache_write` is the 5-minute write rate (1.25x input).
anthropic:
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50 }
  claude-opus-5-5: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
  claude-haiku-5-5: { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125 }

// Hand-written, and deliberately tiny — the same shape as Motet's (tadasant/motet ios/).
//
// Xcode 16 introduced `PBXFileSystemSynchronizedRootGroup`: a folder is a member of a
// target, and every file inside it is compiled without being listed. That is what keeps
// this file free of per-file entries, which matters because it is edited without Xcode.
//
// If Xcode refuses to open it, the recovery is two minutes and loses nothing: File > New >
// Project > App named "Zimmer", delete the generated sources, drag `App/Zimmer` in as a
// folder reference, and add `ios` as a local package dependency (ZimmerKit + ZimmerPlatform).
//
// THREE CONFIGURATIONS. `Staging` is `Debug` plus `ZIMMER_BUILD_ENVIRONMENT = staging`, so
// a build can be pointed at a staging deployment and *say so* — the label is not a
// hostname, which is what lets it live in a public repository when
// `ZIMMER_DEFAULT_WEB_BASE_URL` / `ZIMMER_DEFAULT_API_BASE_URL` cannot. All are empty or
// inherited here and passed on the command line by `ios/bin/build-app`, `ios/bin/ui-test` and `ios/bin/testflight`.
//
// TWO TARGETS. `ZimmerUITests` drives the app on a booted simulator against its debug
// fixture. It is deliberately NOT in the `Zimmer` scheme's testables: `ios/bin/testflight`
// reads `-showBuildSettings -scheme Zimmer` to decide which entitlements file is signed
// in, and that guard reasons about the blocks it gets back.
//
// SIGNING IS OFF and no entitlements file is named. The ones that exist are each listed in
// the exception set below so they are never copied into the bundle, and are signed in only
// by `ios/bin/testflight`, behind its guard.
